<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Runway：从 deadline 倒推每天的航速。Time flies, but I'm the pilot.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#f8f9fb}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Runway</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Nordic desk. Rail (nav + projects) | calendar sheet | task-pool tray. Phone: bottom tabs, pool and editors as sheets. */
:root{
  --bg:#F3F6F9; --surface:#FFFFFF; --sunk:#EAF0F5; --ink:#1E2833; --muted:#687684; --line:#DDE4EA;
  --oak:#B9895A; --oak-soft:#F4EBE0;
  --good:#3F8A62; --good-soft:#E2F1E8; --warn:#B9542F; --warn-soft:#F7E6DF; --mid:#A8812A; --mid-soft:#F5EDD8;
  --scrim:rgba(17,22,28,.38);
  --shadow:0 1px 2px rgba(30,40,51,.06),0 8px 24px rgba(30,40,51,.07);
  --f-display:"Jost","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#182029; --sunk:#1F2833; --ink:#E4EAF0; --muted:#8E9BA8; --line:#2A3440;
  --oak:#D6AE80; --oak-soft:#3A2E22; --good:#79C49A; --good-soft:#1E3529; --warn:#E78C69; --warn-soft:#3D2620; --mid:#D8B260; --mid-soft:#3A3120;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#182029; --sunk:#1F2833; --ink:#E4EAF0; --muted:#8E9BA8; --line:#2A3440;
  --oak:#D6AE80; --oak-soft:#3A2E22; --good:#79C49A; --good-soft:#1E3529; --warn:#E78C69; --warn-soft:#3D2620; --mid:#D8B260; --mid-soft:#3A3120;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
body{--accent-base:#7A2E3D; --accent:var(--accent-base); --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface)); --accent-ink:#fff}
/* Color Hunt palettes (light mode). Dark mode keeps the dark tokens and only borrows the accent. */
body[data-palette="cherry"]{--bg:#FFF9F2;--surface:#FFFFFF;--sunk:#F6EBDD;--line:#EADBC6;--ink:#2A1418;--muted:#8A6B66;--oak:#D45060;--oak-soft:#FBE4E4;--accent-base:#800020}
body[data-palette="coral"]{--bg:#F2FCFC;--surface:#FFFFFF;--sunk:#DDF5F5;--line:#C7E8E9;--ink:#1D3B3D;--muted:#5E7D7F;--oak:#3E9A9C;--oak-soft:#DDF3F3;--accent-base:#C94F4F}
body[data-palette="sage"]{--bg:#FFFCEE;--surface:#FFFFFF;--sunk:#FFEFEF;--line:#EEDFD6;--ink:#2F3A22;--muted:#7D7A6A;--oak:#C98E8E;--oak-soft:#FBE9E9;--accent-base:#5F7A3E}
body[data-palette="navy"]{--bg:#FCF7E8;--surface:#FFFDF6;--sunk:#F5ECD2;--line:#E8DDBA;--ink:#0D1C42;--muted:#5D6787;--oak:#B8913E;--oak-soft:#F5EAD0;--accent-base:#22396F}
body[data-palette="forest"]{--bg:#F6F1E6;--surface:#FFFDF8;--sunk:#EDE3CF;--line:#DFD3BA;--ink:#123F36;--muted:#5F6E64;--oak:#C49A45;--oak-soft:#F3E8D2;--accent-base:#2A6B5C}
body[data-palette="sunset"]{--bg:#FFF7EC;--surface:#FFFFFF;--sunk:#FDEBD3;--line:#F3DAB9;--ink:#3A1A12;--muted:#8A6A5A;--oak:#EB7F31;--oak-soft:#FDE8D6;--accent-base:#C9452F}
body[data-palette="olive"]{--bg:#F5EFE3;--surface:#FFFCF6;--sunk:#ECE2CC;--line:#DDD0B3;--ink:#2B3117;--muted:#6F6A55;--oak:#B8892D;--oak-soft:#F2E6CC;--accent-base:#4F5B2A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-palette]{--bg:#11161C; --surface:#182029; --sunk:#1F2833; --ink:#E4EAF0; --muted:#8E9BA8; --line:#2A3440; --oak:#D6AE80; --oak-soft:#3A2E22}}
:root[data-theme="dark"] body[data-palette]{--bg:#11161C; --surface:#182029; --sunk:#1F2833; --ink:#E4EAF0; --muted:#8E9BA8; --line:#2A3440; --oak:#D6AE80; --oak-soft:#3A2E22}
body[data-accent="fjord"]{--accent-base:#4F7DB3}
body[data-accent="oak"]{--accent-base:#A87A4D}
body[data-accent="sage"]{--accent-base:#5E8E72}
body[data-accent="bauhaus"]{--accent-base:#C8473A}
body[data-accent="memphis"]{--accent-base:#7B62B5}
body[data-accent="harbor"]{--accent-base:#2F6F86}
body[data-accent="burgundy"]{--accent-base:#7A2E3D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--accent:color-mix(in srgb,var(--accent-base) 62%,#fff); --accent-ink:#11161C}}
:root[data-theme="dark"] body{--accent:color-mix(in srgb,var(--accent-base) 62%,#fff); --accent-ink:#11161C}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
h1,h2,h3{text-wrap:balance}

.app{display:grid;grid-template-columns:224px minmax(0,1fr) auto;gap:12px;height:100%;padding:12px}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;padding:16px 12px;gap:12px;min-height:0;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);position:relative;flex:none;overflow:hidden}
.mark::before{content:"";position:absolute;left:5px;right:5px;bottom:9px;height:2px;background:var(--surface);border-radius:2px;box-shadow:0 -5px 0 -0.5px color-mix(in srgb,var(--surface) 55%,transparent)}
.mark::after{content:"";position:absolute;right:6px;top:7px;width:8px;height:8px;background:var(--oak);border-radius:50%}
.brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.02em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.btn-new{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:500}
.btn-new:hover{border-color:var(--accent)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:8px 8px 2px;display:flex;justify-content:space-between;align-items:center}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav svg{width:16px;height:16px;flex:none}
.proj-list{display:flex;flex-direction:column;gap:1px}
.proj-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.proj-row:hover{background:var(--sunk)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.proj-row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-row .d{color:var(--muted);font-size:12px}
.rail-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:0 6px;display:flex;align-items:center;gap:6px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on{background:var(--good)}
.sync.err{background:#c0392b;animation:syncPulse 1.4s ease infinite}
@keyframes syncPulse{50%{opacity:.35}}
.rail-foot{position:relative}
.rail-foot .link{font-size:11px;padding:0;margin-left:4px}
.mini-x{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:6px;font-size:15px;line-height:1}
.mini-x:hover{background:var(--sunk);color:var(--ink)}

.main{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 20px 12px;flex-wrap:wrap}
.eyebrow{font-size:12px;color:var(--muted)}
.top h1{font-family:var(--f-display);font-size:28px;font-weight:600;margin:0;letter-spacing:.01em;line-height:1.15;display:flex;align-items:center;gap:6px}
.top h1 button{border:0;background:none;font:inherit;padding:0;display:flex;align-items:center;gap:6px;color:inherit}
.top h1 button::after{content:"";width:7px;height:7px;border:solid var(--muted);border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translateY(-3px)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.ghost{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;color:var(--ink);white-space:nowrap}
.ghost:hover{border-color:var(--accent)}
.ghost.sm,.primary.sm{padding:3px 9px;font-size:12px;border-radius:7px}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 14px;font-weight:500;white-space:nowrap}
.primary:hover{filter:brightness(1.06)}
.primary:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:inherit}
.pool-toggle[aria-pressed="true"]{background:var(--oak-soft);border-color:var(--oak)}

/* safety line banner */
.banner{margin:0 20px 12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.banner{position:sticky;top:0;z-index:5}
.rings.collapsed{display:none}
/* scrolled past the page header: the banner stays on top in full, projects included */
.banner.stuck{box-shadow:0 6px 18px rgba(0,0,0,.18);background-color:var(--surface)}
.banner.stuck{background-image:none}

.banner-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.banner-head p{margin:0}
.big{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--accent)}
.banner .ctl{display:flex;gap:4px;align-items:center}
.runway{position:relative;height:38px;border-radius:8px;background:var(--sunk);overflow:hidden}
.runway .dash{position:absolute;left:10px;right:10px;top:50%;border-top:2px dashed color-mix(in srgb,var(--muted) 45%,transparent)}
.runway .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:8px 0 0 8px;transition:width .4s}
.runway .line{position:absolute;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--oak)}
.runway .line span{position:absolute;top:-1px;left:7px;font-size:11px;color:var(--oak);white-space:nowrap;font-weight:500}
.runway .plane{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;color:var(--accent);transition:left .4s,transform .4s}
.runway .plane.up{transform:translateY(-5px) rotate(-18deg)}
.runway.met .fill{background:color-mix(in srgb,var(--good) 25%,transparent)}
.runway.met .plane{color:var(--good)}
.countdowns{display:flex;gap:6px;flex-wrap:wrap}
.cd{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--oak-soft);white-space:nowrap}
.cd.exam{background:var(--warn-soft)}
.cd b{font-family:var(--f-display)}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ring{display:flex;gap:10px;align-items:center;font-size:13px;min-width:0}
.ring svg{flex:none}
.ring div{min-width:0}
.ring b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnbar{font-size:12px;border-radius:8px;padding:6px 10px;background:var(--warn-soft);color:var(--warn)}
.okbar{font-size:12px;border-radius:8px;padding:6px 10px;background:var(--good-soft);color:var(--good)}

.view{flex:1 0 auto;padding:0 20px 24px;position:relative}
.main{overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none}
.main>.top,.main>.banner{flex:none}

/* month */
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);padding:0 2px 6px}
.dow div{padding-left:8px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:118px;padding:5px 5px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;position:relative}
.cell:hover{background:var(--bg)}
.cell.out{background:var(--bg)}
.cell.out .dn b{color:var(--muted);opacity:.6}
.cell.rest .dn b::after{content:"休";font-size:10px;color:var(--muted);margin-left:4px;font-family:var(--f-body);font-weight:400}
.drop-hot{background:var(--accent-soft)!important;outline:2px dashed var(--accent);outline-offset:-3px}
.dn{font-family:var(--f-display);font-weight:500;font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:0 2px;gap:4px}
.cell.today .dn b{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;padding:0 6px}
.dn .q{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:400;white-space:nowrap}
.dn .q.over{color:var(--warn)}
.loadbar{height:3px;border-radius:2px;background:var(--sunk);position:relative;margin:0 2px 2px}
.loadbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent);opacity:.7}
.loadbar.over i{background:var(--warn);opacity:1}
.loadbar.done i{background:var(--good)}
.more{font-size:12px;color:var(--muted);padding-left:4px}
.note-mark{width:6px;height:6px;border-radius:50%;background:var(--oak);display:inline-block;margin-left:4px;vertical-align:middle}

.chip{display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.35;padding:3px 6px;border-radius:6px;background:var(--sunk);min-width:0;border-left:3px solid var(--c,var(--accent));user-select:none;-webkit-user-select:none}
.chip[data-drag]{cursor:grab}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.chip .tm{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none}
.chip.done{opacity:.5}
.chip.done .t{text-decoration:line-through}
.chip.deadline{background:var(--oak-soft);border-left-color:var(--oak);font-weight:500}
.chip.deadline::before,.chip.exam::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--oak);flex:none}
.chip.exam{background:var(--warn-soft);border-left-color:var(--warn);font-weight:600}
.chip.exam::before{background:var(--warn)}
.chip.event{background:transparent;border:1px solid var(--line);border-left:3px solid var(--c,var(--accent))}
.chip.ext{background:transparent;border:1px dashed var(--line);border-left:3px solid var(--muted);color:var(--muted);cursor:pointer}
.chip.running{box-shadow:0 0 0 1.5px var(--good) inset}
.ghost-drag{position:fixed;z-index:80;pointer-events:none;opacity:.92;box-shadow:var(--shadow);transform:rotate(-2deg);max-width:240px}
.dragging-src{opacity:.35}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
.chip{-webkit-touch-callout:none}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:360px}
.wcol.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.wcol.rest{background:var(--bg)}
.wcol header{display:flex;flex-direction:column;cursor:pointer;gap:0;min-width:0}
.wcol header b{font-family:var(--f-display);font-size:20px;font-weight:600}
.wcol header small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quota{display:flex;flex-direction:column;gap:3px}
.quota div{font-size:11px;display:flex;justify-content:space-between;gap:6px;color:var(--muted);align-items:center}
.quota div span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quota b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.wadd{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:7px;padding:4px;color:var(--muted);font-size:12px}
.wadd:hover{border-color:var(--accent);color:var(--accent)}

/* generic sections */
.section{display:flex;flex-direction:column;gap:10px;max-width:920px}
.section.wide{max-width:none}
.section h2{font-family:var(--f-display);font-size:16px;font-weight:600;margin:16px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section h2 .hint{font-family:var(--f-body);font-weight:400}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.soft{background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.row .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row .acts{display:flex;gap:4px;flex:none}
.row.overdue{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tag{font-size:11px;border-radius:999px;padding:0 7px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.check{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.icon{border:0;background:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.icon:hover{background:var(--sunk);color:var(--ink)}
.icon svg{width:15px;height:15px}
.empty{color:var(--muted);font-size:13px;padding:16px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap;display:inline-block}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--mid-soft);color:var(--mid)}
button.pill{border:0;cursor:pointer;font-family:inherit}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
.pill.flat{background:var(--sunk);color:var(--muted)}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

<script>
(() => {
'use strict';
const SHARE = true;   // shareable copy: each viewer keeps a private store
/* ================= utilities ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diff = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const monIdx = s => (parse(s).getDay()+6)%7;           // 0 = Monday
const WDN = ['周一','周二','周三','周四','周五','周六','周日'];
const wdName = s => WDN[monIdx(s)];
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const cnd = s => { const d = parse(s); return `${d.getMonth()+1}月${d.getDate()}日`; };
const r2 = x => Math.round(x*100)/100;
const fmtH = h => { h = Math.max(0, h||0); if (h < 0.995) return Math.round(h*60) + 'm'; const H = Math.floor(h + 1e-9), M = Math.round((h-H)*60); return M ? (M===60 ? (H+1)+'h' : `${H}h${M}m`) : H+'h'; };
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const range = (a,b) => { const out=[]; for(let d=a; d<=b; d=add(d,1)) out.push(d); return out; };
const sum = arr => arr.reduce((s,x)=>s+(x||0),0);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const COLORS = [['雾霾蓝','#6B8FB8'],['湖水蓝','#3E8FA8'],['青苔绿','#6E9A5B'],['橄榄绿','#8A9A4A'],['麦穗金','#C4A04A'],['杏橙','#D98C4A'],['陶土红','#C2643F'],['珊瑚红','#E07A6E'],['莓果粉','#C66A8E'],['薰衣紫','#8D7BC4'],['可可棕','#8B6A55'],['石板灰','#73808C']];
const PALETTES = [['classic','北欧雾蓝（原版）',['#F3F6F9','#EAF0F5','#687684','#1E2833'],'burgundy'],['cherry','樱桃奶油',['#D45060', '#FFF9F2', '#F3E6D5', '#800020'],'auto'],['coral','海雾珊瑚',['#CCFBFA', '#B1E5E6', '#F7ADAD', '#F29191'],'auto'],['sage','鼠尾草粉',['#8EA66B', '#FFF9D6', '#FFDCDC', '#D8A2A2'],'auto'],['navy','午夜海军',['#FCF1D0', '#22396F', '#0D1C42', '#010736'],'auto'],['forest','森林黄铜',['#E8DCC4', '#C49A45', '#2A6B5C', '#123F36'],'auto'],['sunset','暖橘日落',['#FCAD38', '#EB7F31', '#E45742', '#972828'],'auto'],['olive','橄榄麦田',['#D8C9A8', '#B8892D', '#4F5B2A', '#F5EFE3'],'auto']];
const ACCENTS = [['burgundy','勃艮第酒红','#7A2E3D'],['fjord','北欧雾蓝','#4F7DB3'],['oak','暖橡木','#A87A4D'],['sage','鼠尾草','#5E8E72'],['bauhaus','包豪斯红','#C8473A'],['memphis','孟菲斯紫','#7B62B5'],['harbor','深海夜航','#2F6F86']];
const KIND = {task:'任务', event:'日程', deadline:'截止', exam:'考试'};
const ICON = {
  play:'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.5v9l7-4.5z"/></svg>',
  stop:'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>',
  trash:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5"/></svg>',
  edit:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10.5 3 13 5.5 6 12.5H3.5V10z"/></svg>',
  cal:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12"/></svg>',
  pin:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 2h4l-.5 4 2.5 2.5H4L6.5 6zM8 8.5V14"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 11.2 3.8 3.4c-.6-.3-1.2.3-1 .9L5 11l8 1-8 1-2.2 6.7c-.2.6.4 1.2 1 .9l17.7-7.8c.7-.3.7-1.3 0-1.6Z"/></svg>',
  prog:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><path d="M8 8V2.3A5.7 5.7 0 0 1 13.7 8z" fill="currentColor" stroke="none"/></svg>'
};

/* ================= store ================= */
const DEF_SETTINGS = { cap:[4,5,5,5,5,3,4], over:{}, weekStart:1, dayStart:0, balance:true, askActual:true, accent:'burgundy', palette:'classic', nick:'', tags:[], gcal:false, home:'today', pinned:false };
const S = { items:{}, projects:{}, notes:{}, settings:{}, timer:{}, ready:false, backend:'local' };
let ver = 0;
let db = null;
let saveErr = false;
let colRef = col => db.collection(col);
const LS = SHARE ? 'runway-share-v1' : 'runway-v2';
function loadLocal(){ try { const o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) for (const k of ['items','projects','notes','settings','timer']) S[k] = o[k] || {}; } catch(e){} }
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify({items:S.items,projects:S.projects,notes:S.notes,settings:S.settings,timer:S.timer})); if (saveErr){ saveErr = false; renderRail(); } }
  catch(e){ saveErr = true; renderRail(); toast('这个浏览器没保存上，可能是存储满了：记得导出备份'); }
}
const chains = {};
function persist(changes){
  if (!db) { saveLocal(); return; }
  for (const c of changes){
    const key = c.col + '/' + c.id;
    chains[key] = (chains[key] || Promise.resolve()).then(() => {
      const ref = colRef(c.col).doc(c.id);
      return (c.data === null ? ref.delete() : ref.set(JSON.parse(JSON.stringify(c.data)))).then(() => { if (saveErr){ saveErr = false; renderRail(); } });
    }).catch(e => {
      if (SHARE && e && e.code === 'invalid_argument'){ fallbackLocal(); return; }
      saveErr = true; renderRail();
      toast(e && e.code === 'quota_exceeded' ? '存储满了：删掉一些旧事项后再试' : '有改动没保存上，检查网络后刷新页面');
    });
  }
}
function applyLocal(changes){
  for (const c of changes){
    const m = {...S[c.col]};
    if (c.data === null) delete m[c.id]; else m[c.id] = c.data;
    S[c.col] = m;
  }
  ver++;
}
const undoStack = [];
function commit(changes, label, opts={}){
  if (!changes.length) return;
  const before = changes.map(c => ({col:c.col, id:c.id, data: S[c.col][c.id] ? JSON.parse(JSON.stringify(S[c.col][c.id])) : null}));
  applyLocal(changes); persist(changes);
  if (opts.undo !== false){ undoStack.push({label, before}); if (undoStack.length > 40) undoStack.shift(); }
  if (label) toast(label, opts.undo !== false ? undo : null);
  render();
}
function undo(){
  const op = undoStack.pop(); if (!op) { toast('没有可以撤销的操作'); return; }
  applyLocal(op.before); persist(op.before); render(); toast('已撤销');
}
const put = (col,id,data,label,opts) => commit([{col,id,data}], label, opts);

async function initStore(){
  let cap = null;
  try { cap = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ cap = null; }
  if (cap && SHARE){
    let u = null; try { u = await window.claude.use('user'); } catch(e){}
    let id = null, can = null;
    try { id = u ? await u.id() : null; can = u ? await u.can('data.write') : null; } catch(e){}
    if (!id || can === false) cap = null;
    else { const base = cap.doc(`data/users/${id}/runway`); colRef = col => base.collection(col); }
  }
  if (!cap){ loadLocal(); S.ready = true; S.backend = 'local'; ver++; if (!hashGo) ui.go = settings().home || 'today'; render(); return; }
  db = cap; S.backend = 'db';
  const seen = new Set();
  for (const col of ['items','projects','notes','settings','timer']){
    colRef(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
      S[col] = m; seen.add(col); ver++;
      if (seen.size === 5 && !S.ready){ S.ready = true; applyAccent(); if (!hashGo) ui.go = settings().home || 'today'; }
      if (col === 'settings') applyAccent();
      if (col === 'timer') renderTimer();
      scheduleRender();
    }, () => toast('同步中断了，刷新页面即可恢复'));
  }
}
function fallbackLocal(){
  if (!db) return;
  db = null; S.backend = 'local'; saveLocal(); render();
  toast('这里不能保存到你的账户，改成保存在这个浏览器里');
}
let rq = 0;
function scheduleRender(){ if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }

/* ================= normalized views ================= */
function settings(){ const s = S.settings.main || {}; return {...DEF_SETTINGS, ...s, cap: (s.cap && s.cap.length===7) ? s.cap : DEF_SETTINGS.cap, over: s.over || {}, tags: s.tags || []}; }
function saveSettings(patch, label){ put('settings','main', {...settings(), ...patch}, label, {undo:false}); }
function normItem(id, it){
  const hours = it.hours != null ? Number(it.hours)||0 : (it.minutes ? Number(it.minutes)/60 : 0);
  return { id, title: it.title || '未命名', date: it.date || null, time: it.time || '', end: it.end || '', hours,
    est: it.est != null ? Number(it.est)||hours : hours, log: it.log || {}, burn: it.burn || null,
    actual: it.actual != null ? Number(it.actual) : null, done: !!it.done, doneOn: it.doneOn || (it.done ? (it.date || null) : null),
    project: it.project || '', module: it.module || '', tags: Array.isArray(it.tags) ? it.tags : [], kind: KIND[it.kind] ? it.kind : 'task',
    note: it.note || '', rep: it.rep || '', order: it.order || 0 };
}
function normProj(id, p){
  return { id, name: p.name || '未命名项目', start: p.start || today(), deadline: p.deadline || add(today(),30), color: p.color || COLORS[0][1],
    buffer: Number(p.buffer)||0, lump: p.lump != null ? Number(p.lump)||0 : (Number(p.totalHours)||0), log: p.log || {},
    modules: Array.isArray(p.modules) ? p.modules : [], note: p.note || '', askActual: p.askActual !== false };
}
function today(){ const s = (S.settings.main && S.settings.main.dayStart) || 0; return ymd(new Date(Date.now() - s*3600e3)); }
function rawToItemData(n){ const {id, ...rest} = n; return rest; }
function rawToProjData(p){ const {id, ...rest} = p; return rest; }

let memoVer = -1, memoDay = '', M = {};
function derive(){
  const t = today();
  if (memoVer === ver && memoDay === t) return M;
  memoVer = ver; memoDay = t;
  const items = Object.entries(S.items).map(([id,it]) => normItem(id, it));
  const projects = Object.entries(S.projects).map(([id,p]) => normProj(id, p)).sort((a,b) => a.deadline.localeCompare(b.deadline));
  const byDate = new Map(), projMap = new Map(projects.map(p => [p.id, p]));
  for (const it of items){ if (it.date){ if (!byDate.has(it.date)) byDate.set(it.date, []); byDate.get(it.date).push(it); } }
  for (const arr of byDate.values()) arr.sort(sortItems);
  const progress = new Map();            // pid -> Map(date -> planned-hours progress)
  const effort = new Map();              // date -> real hours (actual ?? estimate) + logs
  const doneCount = new Map();
  const bump = (m,k,v) => m.set(k, (m.get(k)||0) + v);
  for (const p of projects){ const pm = new Map(); progress.set(p.id, pm); for (const [d,h] of Object.entries(p.log)){ const v = Number(h)||0; if (v){ bump(pm, d, v); bump(effort, d, v); } } }
  for (const it of items){
    const hasLog = it.log && Object.keys(it.log).length > 0;
    if (hasLog) for (const [d,h] of Object.entries(it.log)){ const v = Number(h)||0; if (v) bump(effort, d, v); }
    // progress = remaining hours retired, on the day they were retired (partial work counts the same day)
    if (it.burn && it.kind === 'task' && it.project && progress.has(it.project)) for (const [d,h] of Object.entries(it.burn)){ const v = Number(h)||0; if (v) bump(progress.get(it.project), d, v); }
    if (!it.done || !it.doneOn) continue;
    bump(doneCount, it.doneOn, 1);
    if (it.kind !== 'task') continue;
    if (!hasLog){ const real = it.actual != null ? it.actual : it.est; bump(effort, it.doneOn, real); }
    if (!it.burn && it.project && progress.has(it.project)) bump(progress.get(it.project), it.doneOn, it.est);
  }
  M = { t, items, projects, projMap, byDate, progress, effort, doneCount, alloc: new Map() };
  return M;
}
function sortItems(a,b){ const r = k => ({exam:0,deadline:1,event:2,task:3})[k]; return (a.done - b.done) || (r(a.kind)-r(b.kind)) || (a.time||'99').localeCompare(b.time||'99') || (a.order-b.order) || a.title.localeCompare(b.title); }
const itemsOn = d => derive().byDate.get(d) || [];
function capOf(d){ const s = settings(); return s.over[d] != null ? Number(s.over[d]) : Number(s.cap[monIdx(d)])||0; }
function projTasks(pid){ return derive().items.filter(i => i.project === pid && i.kind === 'task'); }
function logSum(p){ return sum(Object.values(p.log).map(Number)); }
function remNow(p){ return sum(projTasks(p.id).filter(i => !i.done).map(i => i.hours)) + Math.max(0, p.lump - logSum(p)); }
function totalOf(p){ return sum(projTasks(p.id).map(i => i.est)) + Math.max(p.lump, logSum(p)); }
function progOn(pid, d){ const m = derive().progress.get(pid); return m ? (m.get(d) || 0) : 0; }
function remStart(p, D){ let r = remNow(p); const m = derive().progress.get(p.id); if (m) for (const [d,h] of m) if (d >= D) r += h; return r; }
function windowOf(p, D){
  const start = p.start > D ? p.start : D;
  let end = add(p.deadline, -1 - p.buffer);
  if (end < start) end = add(p.deadline, -1);
  if (end < start) return null;
  return [start, end];
}
/* Joint allocation: earliest deadline first; each project spreads its remaining hours over its window,
   weighted by the capacity still free that day (auto-balance) or by raw capacity. */
function allocate(D){
  const dv = derive();
  if (dv.alloc.has(D)) return dv.alloc.get(D);
  const s = settings();
  const byProj = {}, byDay = {}, free = {};
  for (const p of dv.projects){
    const rem = remStart(p, D);
    const w = windowOf(p, D);
    byProj[p.id] = {};
    if (!w || rem <= 1e-6 || p.deadline <= D) continue;
    const days = range(w[0], w[1]);
    let wts = days.map(d => s.balance ? Math.max(0, free[d] != null ? free[d] : capOf(d)) : capOf(d));
    if (sum(wts) < 1e-6) wts = days.map(d => capOf(d));
    if (sum(wts) < 1e-6) wts = days.map(() => 1);
    const tot = sum(wts);
    days.forEach((d,i) => {
      const h = rem * wts[i] / tot; if (h < 1e-6) return;
      byProj[p.id][d] = h; (byDay[d] = byDay[d] || {})[p.id] = h;
      free[d] = (free[d] != null ? free[d] : capOf(d)) - h;
    });
  }
  const res = {byProj, byDay};
  dv.alloc.set(D, res);
  return res;
}
const quota = (pid, D) => (allocate(D).byProj[pid] || {})[D] || 0;
const dayNeed = (d, D = today()) => sum(Object.values(allocate(D).byDay[d] || {}));
const progDay = d => sum(derive().projects.map(p => progOn(p.id, d)));
function workdays(p, D){ const w = windowOf(p, D); return w ? range(w[0], w[1]).filter(d => capOf(d) > 0) : []; }

function projStatus(p, D = today()){
  const rem = remNow(p), total = totalOf(p);
  const left = diff(D, p.deadline);
  const res = { rem, total, left, done: Math.max(0, total - rem) };
  const wd = workdays(p, D);
  const avgCap = wd.length ? sum(wd.map(capOf))/wd.length : 0;
  res.need = wd.length ? remStart(p, D)/wd.length : rem;
  res.planEnd = add(p.deadline, -p.buffer);
  if (total < 1e-6){ res.k = 'flat'; res.label = '待加任务'; res.text = '还没有任务或工作量。点进项目添加任务，或填一个总工作量。'; return res; }
  const reestN = projTasks(p.id).filter(needsReest).length;
  res.reest = reestN;
  if (rem < 1e-3 && reestN){ res.k = 'mid'; res.label = '需要重新估时'; res.text = `还有 ${reestN} 件没完成，但剩余时间记成了 0。点任务旁的进度图标，填一下还需要多久。`; return res; }
  if (rem < 1e-3){ res.k = 'good'; res.label = '全部完成'; res.text = '全部任务已完成。'; return res; }
  if (left <= 0){ res.k = 'bad'; res.label = '已过 Deadline'; res.text = `已过 Deadline ${-left} 天，还剩 ${fmtH(rem)}。`; return res; }
  if (p.start > D){ res.k = 'flat'; res.label = '还没开始'; res.text = `${cnd(p.start)} 开始，还有 ${diff(D,p.start)} 天。`; return res; }
  // 1) shared-capacity pressure: everything every project plans to do inside this project's window,
  //    against the hours you actually have in that window. Projects compete for the same day.
  const w = windowOf(p, D), A = allocate(D).byDay;
  const ds = w ? range(w[0], w[1]) : [];
  const load = sum(ds.map(d => sum(Object.values(A[d] || {}))));
  const capW = sum(ds.map(capOf));
  const press = capW > 0 ? load / capW : 9;
  res.press = press; res.loadAvg = wd.length ? load / wd.length : 0;
  const pk = press > 1 + 1e-6 ? 'bad' : press > .7 ? 'mid' : 'good';
  const pText = `截止前所有项目加起来每个可用日要 ${fmtH(res.loadAvg)}，你平均每天能投入 ${fmtH(avgCap)}（占 ${Math.round(press*100)}%）。`;
  // 2) your own recent pace on this project, if there is enough history
  const pm = derive().progress.get(p.id) || new Map();
  let recent = 0, activeDays = 0;
  for (let k = 0; k < 14; k++){ const d = add(D, -k); const v = pm.get(d) || 0; recent += v; if (v > 0) activeDays++; }
  const span = Math.min(14, diff(p.start, D) + 1);
  const speed = span > 0 ? recent / span : 0;
  res.speed = speed;
  let sk = null, sText = '';
  if (activeDays >= 2 && speed > 0.02){
    const daysNeeded = Math.ceil(rem / speed);
    res.forecast = add(D, daysNeeded - 1);
    const early = diff(res.forecast, p.deadline) - 1;
    res.early = early;
    sk = early < 0 ? 'bad' : early < p.buffer ? 'mid' : 'good';
    sText = early < 0 ? `按最近两周的速度，预计 ${cnd(res.forecast)} 完成，会晚 ${-early} 天。` : `按最近两周的速度，预计 ${cnd(res.forecast)} 完成，提前 ${early} 天。`;
  }
  // the worse of the two decides
  const rank = {good:0, mid:1, bad:2};
  const k = sk && rank[sk] > rank[pk] ? sk : pk;
  res.k = k;
  res.label = k === 'good' ? '稳' : k === 'mid' ? '有点赶' : (pk === 'bad' ? '时间不够' : '会晚');
  res.text = (sText ? sText + ' ' : '') + pText + (sk ? '' : ' 完成几件任务后，会再按你的实际速度预计完成日。');
  return res;
}

function colorOf(it){

function isDueTag(it){ const s = settings(); return it.tags.some(id => (s.tags.find(t => t.id === id) || {}).due); }
function chip(it, opts = {}){

function extChip(e){ return `<div class="chip ext" data-ext="${esc(e.id)}" title="Google 日历：${esc(e.title)}">${e.time ? `<span class="tm">${esc(e.time)}</span>` : ''}<span class="t">${esc(e.title)}</span></div>`; }
function rowItem(it, o = {}){

    <span class="acts">${o.quick && !it.done ? `<button class="ghost sm" type="button" data-move="${esc(it.id)}" data-to="${t}">今天</button><button class="ghost sm hide-sm" type="button" data-move="${esc(it.id)}" data-to="${add(t,1)}">明天</button>` : ''}${canTime ? `<button class="icon" type="button" data-progress="${esc(it.id)}" aria-label="记录进度">${ICON.prog}</button><button class="icon" type="button" data-timer-item="${esc(it.id)}" aria-label="${timerOn('item', it.id) ? '停止计时' : '开始计时'}">${timerOn('item', it.id) ? ICON.stop : ICON.play}</button>` : ''}${o.del ? `<button class="icon" type="button" data-del="${esc(it.id)}" aria-label="删除">${ICON.trash}</button>` : ''}</span>

function donut(pct, color, size = 44, stroke = 6){
  const r = (size - stroke)/2, c = 2*Math.PI*r, v = clamp(pct, 0, 1);

}

/* ================= banner: dynamic safety line ================= */
function bannerHTML(D = today()){
  const dv = derive();
  if (!S.ready) return `<p class="hint">正在载入你的计划…</p>`;
  const ps = dv.projects.filter(p => quota(p.id, D) > 1e-4 || progOn(p.id, D) > 0);
  const line = sum(dv.projects.map(p => quota(p.id, D)));
  const done = sum(dv.projects.map(p => progOn(p.id, D)));
  const cap = capOf(D);
  const t = today();
  const word = D === t ? '今天' : '这天';
  const upcoming = dv.items.filter(i => (i.kind === 'deadline' || i.kind === 'exam') && i.date && i.date >= t && !i.done).sort((a,b) => a.date.localeCompare(b.date)).slice(0,3);
  const cds = upcoming.map(u => { const n = diff(t, u.date); return `<span class="cd ${u.kind === 'exam' ? 'exam' : ''}">${esc(u.title)} · ${n === 0 ? '<b>今天</b>' : `<b>${n}</b> 天`}</span>`; }).join('');
  if (!dv.projects.length) return `<div class="banner-head"><p>建一个有 deadline 的计划项目，这里每天会算出${word}的航速：照这个速度飞，就能准时落地。</p><button class="primary" type="button" data-act="newproj">新建计划项目</button></div>${cds ? `<div class="countdowns">${cds}</div>` : ''}`;
  if (line < 1e-3 && done < 1e-3) return `<div class="banner-head"><p>${cap === 0 ? `${word}是休息日，引擎熄火，好好休息。` : `${word}没有要赶的航程，自由飞行。`}</p><div class="countdowns">${cds}</div></div>`;
  const met = done >= line - 1e-3;
  const scale = Math.max(line * 1.3, done * 1.05, 0.5);
  const pct = clamp(done/scale*100, 0, 100), lp = clamp(line/scale*100, 2, 98);
  const msg = met ? (done - line > 0.05 ? `<b>✓ ${word}的航速跟上了</b> · 多飞了 ${fmtH(done-line)}，后面几天可以松点油门` : `<b>✓ ${word}的航速刚好</b> · 照这个速度，准时落地`) : (done > 0 ? `还差 <span class="big">${fmtH(line-done)}</span> 跟上${word}的航速` : `${word}航速 <span class="big">${fmtH(line)}</span>，照这个速度飞，准时落地`);
  const overCap = cap > 0 && line > cap + 0.05 ? `<div class="warnbar">${word}建议 ${fmtH(line)}，超过了可投入的 ${fmtH(cap)}。可以提前某个项目的开始日期、放宽 Deadline，或在设置里调高每天可投入的时间。</div>` : cap === 0 && line > 0 ? `<div class="warnbar">${word}设成了休息日，但已经过了计划完成日，剩下的只能挤进来。</div>` : '';
  const rings = dv.projects.length ? `<div class="rings${ui.expand ? '' : ' collapsed'}">${ps.map(p => { const q = quota(p.id, D), d = progOn(p.id, D); const st = projStatus(p, D); const wd = workdays(p, D).length; const later = wd > 2 ? remStart(p, D)/(wd-2) : null; return `<div class="ring">${donut(q ? d/q : 1, p.color)}<div><b>${esc(p.name)}</b><span class="mono hint">${fmtH(d)} / ${fmtH(q)}</span> <span class="pill ${st.k}" title="${esc(st.text)}">${st.label}</span>${later && later - st.need >= 1/60 ? `<div class="hint">要是歇两天，之后每天多 ${fmtH(later - st.need)}</div>` : ''}</div></div>`; }).join('')}</div>` : '';
  return `<div class="banner-head"><p>${msg}</p><div class="ctl"><div class="countdowns hide-sm">${cds}</div><button class="icon" type="button" data-act="expand" aria-label="${ui.expand ? '收起' : '展开每个项目'}" title="展开：看每个项目">${ui.expand ? '−' : '＋'}</button></div></div>
    <div class="runway ${met ? 'met' : ''}" role="img" aria-label="已飞 ${fmtH(done)}，航速 ${fmtH(line)}"><div class="dash"></div><div class="fill" style="width:${pct}%"></div><div class="line" style="left:calc(${lp}% - 1px)"><span>航速 ${fmtH(line)}</span></div><div class="plane ${met ? 'up' : ''}" style="left:clamp(14px, ${pct}%, calc(100% - 14px))">${ICON.plane}</div></div>
    ${overCap}${rings}`;
}

function gridStart(cursor){ const s = settings(); const first = parse(cursor.slice(0,8) + '01'); const off = (first.getDay() - s.weekStart + 7) % 7; return add(ymd(first), -off); }
function weekStartOf(d){ const s = settings(); const off = (parse(d).getDay() - s.weekStart + 7) % 7; return add(d, -off); }
function dowLabels(){ const s = settings(); return Array.from({length:7}, (_,i) => WDN[(i + s.weekStart + 6) % 7]); }

function viewMonth(){

      if (need > 0.01 || sched > 0.01){ const over = cap > 0 ? need > cap + 0.05 : need > 0.05; q = `<span class="q ${over ? 'over' : ''}" title="${sched > 0.01 ? '已安排的项目时长 / ' : ''}航速">${sched > 0.01 ? fmtH(sched) + '/' : ''}${fmtH(need)}</span>`; bar = `<div class="loadbar ${over ? 'over' : ''}"><i style="width:${clamp(cap ? need/cap*100 : 100, 4, 100)}%"></i></div>`; }
    } else {
      const done = derive().effort.get(d) || 0;

      ${all.slice(0, max).map(a => a.html()).join('')}${all.length > max ? `<div class="more">还有 ${all.length - max} 件</div>` : ''}
    </div>`;

  return h + '</div>';
}

    let acc = 0;
    for (const p of dv.projects){ const v = (a.byDay[d] || {})[p.id] || 0; if (v < 1e-3) continue; bars += `<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(0.5, y(acc) - y(acc+v))}" fill="${p.color}" rx="1.5"><title>${esc(p.name)} ${fmtH(v)}</title></rect>`; acc += v; }
    const c = capOf(d);

  });

    ${over.length ? `<div class="warnbar">${over.slice(0,3).map(cnd).join('、')}${over.length > 3 ? ` 等 ${over.length} 天` : ''}超过了当天可投入的时间（红色虚线）。可以提前某个项目的开始日期，或放宽 Deadline。</div>` : (settings().balance ? `<div class="hint">多个项目同时进行时，已经按截止先后自动分均匀，避免某一天特别多。点柱子看当天详情。</div>` : `<div class="hint">「自动分均匀」是关的，有的日子会特别多。可以在设置里打开。</div>`)}`;

function streakCount(){
  const t = today(); let n = 0;
  for (let k = 0; k < 45; k++){
    const d = add(t, -k);
    const q = sum(derive().projects.map(p => quota(p.id, d)));
    const g = progDay(d);
    if (q < 0.05) { if (k > 0 && g <= 0) continue; if (g > 0) { n++; } continue; }
    if (g >= q - 0.02) n++; else if (k === 0) continue; else break;
  }
  return n;
}

function viewToday(){

  const overdue = dv.items.filter(i => !i.done && i.date && i.date < t && i.kind === 'task').sort((a,b) => a.date.localeCompare(b.date));

  const nick = settings().nick;
  const streak = streakCount();
  // yesterday reconciliation
  const qy = sum(dv.projects.map(p => quota(p.id, y))), gy = progDay(y);
  let recon = '';
  if (qy > 0.05){
    const rest = sum(dv.projects.map(p => workdays(p, t).length ? 1 : 0)) ? Math.max(1, Math.round(sum(dv.projects.map(p => workdays(p,t).length)) / Math.max(1, dv.projects.filter(p => workdays(p,t).length).length))) : 1;
    const dlt = gy - qy, ey = dv.effort.get(y) || 0;

  const ext = gcalOn(t);

      <div class="capacity-metrics"><div><small>今天可投入</small><strong>${fmtH(capToday)}</strong></div><div><small>已投入</small><strong>${fmtH(spentT)}</strong></div><div><small>还可安排</small><strong>${fmtH(leftT)}</strong></div></div>

function bucketOf(it, t){
  if (!it.date) return '未排期';
  if (it.date < t) return it.done ? '更早' : '已逾期';
  if (it.date === t) return '今天';
  if (it.date === add(t,1)) return '明天';
  const ws = weekStartOf(t);
  if (it.date < add(ws, 7)) return '本周';
  if (it.date < add(ws, 14)) return '下周';
  return '以后';
}

function moduleSpeed(p, mid){
  const done = projTasks(p.id).filter(i => i.module === mid && i.done && i.actual != null && i.est > 0);
  const ok = done.filter(i => { const r = i.actual / i.est; return r > 0.25 && r < 4; });
  if (ok.length < 3) return { n: ok.length };
  return { n: ok.length, ratio: sum(ok.map(i => i.actual)) / sum(ok.map(i => i.est)), avgA: sum(ok.map(i => i.actual))/ok.length, avgP: sum(ok.map(i => i.est))/ok.length };
}

/* ---------- stats ---------- */
function periodRange(){
  const t = today(), P = ui.stats.period, off = ui.stats.off;
  if (P === '30'){ const e = add(t, -30*off); return {from: add(e, -29), to: e, label: off ? `${cnd(add(e,-29))} – ${cnd(e)}` : '近 30 天', prevWord: '前 30 天', unit:'day'}; }
  if (P === 'week'){ const s = add(weekStartOf(t), -7*off); return {from: s, to: add(s, 6), label: off === 0 ? '本周' : off === 1 ? '上周' : `${cnd(s)} – ${cnd(add(s,6))}`, prevWord: '前一周', unit:'day'}; }
  if (P === 'month'){ const d = parse(t); const f = new Date(d.getFullYear(), d.getMonth() - off, 1); const l = new Date(f.getFullYear(), f.getMonth()+1, 0); return {from: ymd(f), to: ymd(l), label: off === 0 ? '本月' : `${f.getFullYear()}年${f.getMonth()+1}月`, prevWord: '前一个月', unit:'day'}; }
  const yr = parse(t).getFullYear() - off; return {from: `${yr}-01-01`, to: `${yr}-12-31`, label: off === 0 ? '今年' : `${yr} 年`, prevWord: '前一年', unit:'month'};
}
function periodStats(from, to){
  const dv = derive(), t = today();
  const end = to > t ? t : to;
  const ds = from <= end ? range(from, end) : [];
  const hours = sum(ds.map(d => dv.effort.get(d) || 0));
  const doneN = dv.items.filter(i => i.done && i.doneOn && i.doneOn >= from && i.doneOn <= to).length;
  const planned = dv.items.filter(i => i.date && i.date >= from && i.date <= end && i.kind === 'task').length;
  const plannedDone = dv.items.filter(i => i.date && i.date >= from && i.date <= end && i.kind === 'task' && i.done).length;
  const active = ds.filter(d => (dv.effort.get(d) || 0) > 0 || (dv.doneCount.get(d) || 0) > 0).length;
  return { ds, hours, doneN, planned, rate: planned ? plannedDone/planned : null, active, avg: active ? hours/active : 0 };
}
function deltaHTML(now, prev, unit = '', pct = false){
  if (prev == null || (prev === 0 && now === 0)) return `<span class="delta flat">${prev == null ? '无对比' : '持平'}</span>`;
  const d = now - prev;
  if (Math.abs(d) < 1e-6) return `<span class="delta flat">持平</span>`;
  const txt = pct ? `${Math.abs(Math.round(d*100))} 个百分点` : unit === 'h' ? fmtH(Math.abs(d)) : `${Math.abs(Math.round(d*10)/10)}${unit}`;
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '↑' : '↓'} ${txt}</span>`;
}
function viewStats(){
  const R = periodRange(), dv = derive(), t = today();
  const len = diff(R.from, R.to) + 1;
  const pFrom = R.unit === 'month' ? `${Number(R.from.slice(0,4)) - 1}-01-01` : (ui.stats.period === 'month' ? (() => { const f = parse(R.from); return ymd(new Date(f.getFullYear(), f.getMonth()-1, 1)); })() : add(R.from, -len));
  const pTo = add(R.from, -1);
  const now = periodStats(R.from, R.to), prev = periodStats(pFrom, pTo);
  // trend
  let buckets;
  if (R.unit === 'month'){ buckets = Array.from({length:12}, (_,m) => { const f = `${R.from.slice(0,4)}-${pad(m+1)}-01`; const l = ymd(new Date(Number(R.from.slice(0,4)), m+1, 0)); return {label: `${m+1}月`, from: f, to: l}; }); }
  else buckets = range(R.from, R.to).map(d => ({label: String(parse(d).getDate()), from: d, to: d}));
  const bh = buckets.map(b => sum(range(b.from, b.to > t ? (b.from > t ? b.from : t) : b.to).map(d => b.from > t ? 0 : (dv.effort.get(d) || 0))));
  const bc = buckets.map(b => dv.items.filter(i => i.done && i.doneOn && i.doneOn >= b.from && i.doneOn <= b.to).length);
  const W = 720, H = 180, pl = 44, pb = 22, pt = 10, maxV = Math.max(1, ...bh), bw = (W - pl - 6) / buckets.length;
  const yy = v => pt + (H - pt - pb) * (1 - v/maxV);
  const trend = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="投入时长趋势">${[0, maxV/2, maxV].map(v => `<line class="gridl" x1="${pl}" x2="${W}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${pl-4}" y="${yy(v)+3}" text-anchor="end">${fmtH(v)}</text>`).join('')}${buckets.map((b,i) => `<rect x="${pl + i*bw + bw*.15}" y="${yy(bh[i])}" width="${bw*.7}" height="${Math.max(0, H - pb - yy(bh[i]))}" fill="var(--accent)" rx="2"><title>${b.label}：投入 ${fmtH(bh[i])}，完成 ${bc[i]} 件</title></rect>${(buckets.length <= 14 || i % Math.ceil(buckets.length/12) === 0) ? `<text x="${pl + i*bw + bw/2}" y="${H-6}" text-anchor="middle">${b.label}</text>` : ''}`).join('')}</svg></div>`;
  // distribution
  const distM = new Map();
  for (const i of dv.items){ if (!i.done || !i.doneOn || i.doneOn < R.from || i.doneOn > R.to || i.kind !== 'task') continue; const k = i.project || '_'; distM.set(k, (distM.get(k)||0) + (i.actual != null ? i.actual : i.est)); }
  for (const p of dv.projects) for (const [d,h] of Object.entries(p.log)) if (d >= R.from && d <= R.to) distM.set(p.id, (distM.get(p.id)||0) + Number(h));
  const dist = [...distM].map(([k,v]) => { const p = dv.projMap.get(k); return {label: p ? p.name : '独立事项', color: p ? p.color : 'var(--muted)', v}; }).filter(x => x.v > 0).sort((a,b) => b.v - a.v);
  const dTot = sum(dist.map(x => x.v));
  let acc = 0; const C = 2*Math.PI*36;
  const donutSvg = `<svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="时间分布"><circle cx="55" cy="55" r="36" fill="none" stroke="var(--sunk)" stroke-width="16"/>${dist.map(x => { const len = C * x.v/dTot; const s = `<circle cx="55" cy="55" r="36" fill="none" stroke="${x.color}" stroke-width="16" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 55 55)"><title>${esc(x.label)} ${fmtH(x.v)}</title></circle>`; acc += len; return s; }).join('')}<text x="55" y="52" text-anchor="middle" style="font-size:11px;fill:var(--muted)">总投入</text><text x="55" y="68" text-anchor="middle" style="font-size:14px;fill:var(--ink);font-family:var(--f-display)">${fmtH(dTot)}</text></svg>`;
  // heatmap: from the month of first use to today
  const used = [...dv.effort.keys(), ...dv.doneCount.keys(), ...dv.items.filter(i => i.date && i.date <= t).map(i => i.date)].filter(d => d && d <= t).sort();
  const first = used[0] || t;
  const firstMonth = first.slice(0, 7) + '-01';
  const hs = weekStartOf(firstMonth); const cells = []; let maxE = 0;
  for (let d = hs; d <= t; d = add(d,1)){ const v = dv.effort.get(d) || 0; maxE = Math.max(maxE, v); cells.push([d, v]); }
  const lvl = v => v <= 0 ? 0 : v < maxE*.25 ? 1 : v < maxE*.5 ? 2 : v < maxE*.75 ? 3 : 4;
  const fills = ['var(--sunk)', 'color-mix(in srgb,var(--accent) 30%,var(--surface))', 'color-mix(in srgb,var(--accent) 55%,var(--surface))', 'color-mix(in srgb,var(--accent) 78%,var(--surface))', 'var(--accent)'];
  const nW = Math.ceil(cells.length / 7), hW = nW*13 + 20, hH = 7*13 + 18;
  const heat = `<div class="chart" style="overflow-x:auto"><svg class="heat" viewBox="0 0 ${hW} ${hH}" style="width:${Math.max(hW*1.5, 240)}px;min-width:0;max-width:100%;height:auto" role="img" aria-label="完成热力图">${cells.map(([d,v], i) => { const w = Math.floor(i/7), r = i % 7; return `<rect x="${20 + w*13}" y="${r*13}" width="11" height="11" fill="${d < firstMonth ? 'transparent' : fills[lvl(v)]}"><title>${cnd(d)}：投入 ${fmtH(v)} · 划掉 ${dv.doneCount.get(d) || 0} 件</title></rect>`; }).join('')}${cells.filter(([d]) => parse(d).getDate() === 1).map(([d]) => { const i = cells.findIndex(c => c[0] === d); return `<text x="${20 + Math.floor(i/7)*13}" y="${7*13 + 12}">${parse(d).getMonth()+1}月</text>`; }).join('')}</svg></div><div class="legend"><span>少</span>${fills.map(f => `<i style="background:${f};width:11px;height:11px"></i>`).join('')}<span>多</span></div>`;
  // weekday rhythm
  const wk = Array(7).fill(0), wn = Array(7).fill(0);
  for (const d of now.ds){ wk[monIdx(d)] += dv.effort.get(d) || 0; wn[monIdx(d)]++; }
  const wavg = wk.map((v,i) => wn[i] ? v/wn[i] : 0), wmax = Math.max(0.01, ...wavg), best = wavg.indexOf(Math.max(...wavg));
  const rhythm = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px">${wavg.map((v,i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end" title="${WDN[i]} 平均投入 ${fmtH(v)}，算了 ${wn[i]} 个${WDN[i]}"><span class="mono hint">${v ? fmtH(v) : ''}</span><div style="width:70%;height:${v/wmax*80}%;min-height:2px;background:${i === best && v ? 'var(--oak)' : 'var(--accent)'};border-radius:4px 4px 2px 2px"></div><span class="hint">${WDN[i].slice(1)}</span></div>`).join('')}</div>`;
  // estimate accuracy (beyond)
  const acc2 = dv.items.filter(i => i.done && i.actual != null && i.est > 0 && i.doneOn >= R.from && i.doneOn <= R.to);
  const ratio = acc2.length ? sum(acc2.map(i => i.actual))/sum(acc2.map(i => i.est)) : null;
  const msg = now.doneN || now.hours ? `${R.label}划掉了 ${now.doneN} 件事，投入 ${fmtH(now.hours)}${prev.hours ? (now.hours > prev.hours*1.05 ? `，比${R.prevWord}多 ${Math.round((now.hours/prev.hours - 1)*100)}%` : now.hours < prev.hours*.95 ? `，比${R.prevWord}少 ${Math.round((1 - now.hours/prev.hours)*100)}%` : `，和${R.prevWord}差不多稳`) : ''}。` : `${R.label}还没有记录。`;
  return `<div class="section">
    <div class="inline"><div class="seg">${[['30','近 30 天'],['week','周'],['month','月'],['year','年']].map(([k,l]) => `<button type="button" data-sp="${k}" aria-pressed="${ui.stats.period === k}">${l}</button>`).join('')}</div><div class="seg"><button type="button" data-soff="1" aria-label="上一期">‹</button><button type="button" data-soff="-1" aria-label="下一期" ${ui.stats.off === 0 ? 'disabled' : ''}>›</button></div>${ui.stats.off ? `<button class="link" type="button" data-soff="0">回到现在</button>` : ''}<span class="hint">${cnd(R.from)} – ${cnd(R.to)}</span></div>
    <p style="margin:4px 0 0">${msg}</p>
    <div class="kpis">
      <div class="kpi"><small>完成事项</small><b>${now.doneN}<small> 件</small></b><br>${deltaHTML(now.doneN, prev.doneN, ' 件')}</div>
      <div class="kpi"><small>投入时长</small><b>${fmtH(now.hours)}</b><br>${deltaHTML(now.hours, prev.hours, 'h')}</div>
      <div class="kpi"><small>完成率</small><b>${now.rate == null ? '—' : Math.round(now.rate*100) + '%'}</b><br>${now.rate != null && prev.rate != null ? deltaHTML(now.rate, prev.rate, '', true) : `<span class="delta flat">${now.planned ? `${now.planned} 件里` : '无对比'}</span>`}</div>
      <div class="kpi"><small>活跃天数</small><b>${now.active}<small> / ${now.ds.length} 天</small></b><br>${deltaHTML(now.active, prev.active, ' 天')}</div>
      <div class="kpi"><small>日均投入</small><b>${fmtH(now.avg)}</b><br><span class="delta flat">按有记录的天算</span></div>
      <div class="kpi"><small>预计 vs 实际</small><b>${ratio ? ratio.toFixed(2) + '×' : '—'}</b><br><span class="delta flat">${ratio ? (ratio > 1.1 ? '实际比预计久，预计可以放宽' : ratio < .9 ? '比预计快' : '估得很准') : '记录实际用时后显示'}</span></div>
    </div>
    <h2>投入时长趋势</h2>${trend}
    <div class="grid2" style="align-items:start">
      <div><h2>时间分布</h2>${dist.length ? `<div class="dist">${donutSvg}<ul>${dist.map(x => `<li><span class="dot" style="background:${x.color}"></span><span style="flex:1;min-width:0">${esc(x.label)}</span><b class="mono">${Math.round(x.v/dTot*100)}%</b></li>`).join('')}</ul></div>` : '<div class="empty">这段时间还没有完成记录。</div>'}</div>
      <div><h2>一周节奏 <span class="hint">${wavg[best] ? `最投入的一天：${WDN[best]}` : ''}</span></h2>${rhythm}</div>
    </div>
    <h2>完成热力图 <span class="hint">从 ${parse(first).getFullYear()}年${parse(first).getMonth()+1}月开始使用算起</span></h2>${heat}
    <h2>项目进度</h2>${dv.projects.length ? dv.projects.map(p => { const st = projStatus(p); return `<div class="row"><span class="dot" style="background:${p.color}"></span><span class="t" data-openproj="${p.id}">${esc(p.name)}</span><div class="stack" style="width:30%;--c:${p.color}"><i class="d" style="width:${st.total ? st.done/st.total*100 : 0}%"></i></div><span class="meta">${st.total ? Math.round(st.done/st.total*100) : 0}% · ${st.left > 0 ? `还剩 ${st.left} 天` : '已过期'}</span></div>`; }).join('') : '<div class="empty">还没有项目。</div>'}
    <h2>✦ 周回顾</h2>

  </div>`;
}

/* ---------- book ---------- */
function bookWeeks(){
  const dv = derive(), t = today();
  const yr = parse(t).getFullYear();
  let ws = weekStartOf(`${yr}-01-01`); const out = [];
  for (; ws <= t; ws = add(ws, 7)){
    const days = range(ws, add(ws, 6));
    const done = dv.items.filter(i => i.done && i.doneOn && i.doneOn >= ws && i.doneOn <= add(ws,6));
    const notes = days.filter(d => S.notes[d] && S.notes[d].text);
    if (done.length || notes.length) out.push({ws, days, done, notes});
  }
  return out;
}
function viewBook(){
  const weeks = bookWeeks(), t = today();
  const i = clamp(ui.book.i, 0, weeks.length);
  ui.book.i = i;
  let page;
  if (i === 0){
    const totN = sum(weeks.map(w => w.done.length));
    page = `<div class="page cover" data-act="book-next" id="bookpage"><div><p style="opacity:.8;margin:0">Runway · Time flies, but I'm the pilot.</p><h2>回响之书</h2><p style="opacity:.85">${parse(t).getFullYear()} 年 · ${weeks.length} 周 · 划掉 ${totN} 件</p></div><p style="opacity:.85;margin:0">做过的事，都留在这里。<br>点封面翻开</p></div>`;
  } else {
    const w = weeks[i - 1], dv = derive();
    const hrs = sum(w.days.map(d => dv.effort.get(d) || 0));
    const per = w.days.map(d => dv.effort.get(d) || 0); const best = per.indexOf(Math.max(...per));
    const planned = dv.items.filter(x => x.date && x.date >= w.ws && x.date <= add(w.ws,6) && x.kind === 'task');
    const allDone = planned.length && planned.every(x => x.done);
    const wn = Math.floor(diff(weekStartOf(`${w.ws.slice(0,4)}-01-01`), w.ws)/7) + 1;
    page = `<div class="page" id="bookpage"><p class="hint" style="margin:0">第 ${wn} 周 · ${cnd(w.ws)} – ${cnd(add(w.ws,6))}</p><h3>${allDone ? '这一周，全部划掉了。' : `这一周划掉了 ${w.done.length} 件事`}</h3>
      <dl><dt>投入</dt><dd class="mono">${fmtH(hrs)}</dd>${per[best] ? `<dt>最投入</dt><dd>${WDN[monIdx(w.days[best])]} · ${fmtH(per[best])}</dd>` : ''}</dl>
      ${w.days.map(d => { const its = w.done.filter(x => x.doneOn === d); const n = S.notes[d] && S.notes[d].text; if (!its.length && !n) return ''; return `<div class="day"><b>${cnd(d)} ${wdName(d)}</b>${its.length ? `<ul>${its.slice(0,8).map(x => `<li>${esc(x.title)}</li>`).join('')}${its.length > 8 ? `<li class="hint">还有 ${its.length - 8} 件</li>` : ''}</ul>` : ''}${n ? `<div class="note">${esc(n)}</div>` : ''}</div>`; }).join('')}</div>`;
  }
  return `<div class="book-wrap"><div class="book">${page}</div>
    <div class="inline"><button class="ghost" type="button" data-act="book-prev" ${i === 0 ? 'disabled' : ''}>‹ 上一页</button><span class="hint">${i === 0 ? '封面' : `${i} / ${weeks.length}`}</span><button class="ghost" type="button" data-act="book-next" ${i >= weeks.length ? 'disabled' : ''}>下一页 ›</button></div>
    <p class="hint">← → 也可以翻页 · 手机上左右滑动</p>${weeks.length ? '' : '<div class="empty">这一年还没有记录。划掉第一件事，或写下第一句给自己的话，就会装订进来。</div>'}</div>`;
}

/* ================= quick-add natural language ================= */
const CN = {'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'日':7,'天':7};
function cnNum(s){ if (/^\d+$/.test(s)) return Number(s); if (s === '十') return 10; if (s.length === 2 && s[0] === '十') return 10 + (CN[s[1]]||0); if (s.length === 2 && s[1] === '十') return (CN[s[0]]||0)*10; if (s.length === 3 && s[1] === '十') return (CN[s[0]]||0)*10 + (CN[s[2]]||0); return CN[s] || NaN; }
function nextWeekday(base, wd, weekOffset){
  // wd: 0=Mon..6=Sun
  if (weekOffset == null){ let d = base; for (let k = 0; k < 7; k++){ if (monIdx(d) === wd) return d; d = add(d, 1); } return base; }
  const mon = add(base, -monIdx(base));
  return add(mon, weekOffset*7 + wd);
}
function parseQuick(text, base){
  const t = base || today();
  const r = { title:'', date: undefined, time:'', end:'', hours:0, rep:null, until:null, tags:[], tagNames:[], project:'', kind:null, bits:[] };
  let s = ' ' + text + ' ';
  const take = (re, fn) => { s = s.replace(re, (...m) => { fn(...m); return ' '; }); };
  take(/#([^\s#@]+)/g, (_, n) => r.tagNames.push(n));
  take(/@([^\s#@]+)/g, (_, n) => { const p = derive().projects.find(p => p.name.toLowerCase().includes(n.toLowerCase())); if (p){ r.project = p.id; r.bits.push('归入 ' + p.name); } });
  // repeat
  take(/(?:到|直到)\s*(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/, (_, m, d) => { const y = parse(t).getFullYear(); let u = `${y}-${pad(m)}-${pad(d)}`; if (u < t) u = `${y+1}-${pad(m)}-${pad(d)}`; r.until = u; });
  take(/每个?工作日/, () => r.rep = {type:'weekdays'});
  take(/每(?:天|日)/, () => r.rep = {type:'daily'});
  take(/(?:每两周|隔周)\s*(?:周|星期)?([一二三四五六日天])?/, (_, w) => r.rep = {type:'biweekly', wd: w ? (CN[w]-1) : null});
  take(/每(?:周|星期)([一二三四五六日天、,，]+)/, (_, ws) => r.rep = {type:'weekly', days: [...ws].filter(c => CN[c]).map(c => CN[c]-1)});
  take(/每周/, () => r.rep = r.rep || {type:'weekly', days:[]});
  take(/每月\s*(\d{1,2})\s*[号日]/, (_, d) => r.rep = {type:'monthly', dom: Number(d)});
  // duration
  take(/(\d+(?:\.\d+)?)\s*(?:h|H|小时|个小时)(?:\s*(\d{1,2})\s*(?:m|min|分钟?))?/, (_, h, m) => r.hours = Number(h) + (m ? Number(m)/60 : 0));
  take(/(\d{1,3})\s*(?:min|分钟)/, (_, m) => r.hours = Number(m)/60);
  take(/一个半小时/, () => r.hours = 1.5);
  take(/半小时/, () => r.hours = 0.5);
  // dates
  let ampm = null;
  take(/(今晚|明晚)/, (_, w) => { r.date = w === '今晚' ? t : add(t, 1); ampm = 'pm'; });
  take(/大后天/, () => r.date = add(t, 3));
  take(/后天/, () => r.date = add(t, 2));
  take(/明天|明日/, () => r.date = add(t, 1));
  take(/今天|今日/, () => r.date = t);
  take(/(下下|下个?|本|这个?)?\s*(?:周|星期|礼拜)([一二三四五六日天])/, (_, pre, w) => { const wd = CN[w]-1; const off = !pre ? null : /下下/.test(pre) ? 2 : /下/.test(pre) ? 1 : 0; r.date = nextWeekday(t, wd, off); if (r.rep && r.rep.type === 'weekly' && !r.rep.days.length) r.rep.days = [wd]; });
  take(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/, (_, y, m, d) => r.date = `${y}-${pad(m)}-${pad(d)}`);
  take(/(\d{1,2}|[一二三四五六七八九十]{1,3})\s*月\s*(\d{1,2}|[一二三四五六七八九十]{1,3})\s*[日号]?/, (_, m, d) => { const y = parse(t).getFullYear(); let v = `${y}-${pad(cnNum(m))}-${pad(cnNum(d))}`; if (v < add(t, -60)) v = `${y+1}-${pad(cnNum(m))}-${pad(cnNum(d))}`; r.date = v; });
  take(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/, (_, m, d) => { const y = parse(t).getFullYear(); let v = `${y}-${pad(m)}-${pad(d)}`; if (v < add(t, -60)) v = `${y+1}-${pad(m)}-${pad(d)}`; r.date = v; });
  // times
  const tm = (pre, h, mm, half) => { let H = Number(h); const P = pre || ampm; if (P && /下午|晚上|傍晚|pm/.test(P) && H < 12) H += 12; if (P && /中午/.test(P) && H < 6) H += 12; if (!P && H >= 1 && H <= 6) H += 12; const Mi = half ? 30 : (mm ? Number(mm) : 0); return `${pad(clamp(H,0,23))}:${pad(clamp(Mi,0,59))}`; };
  const T = '(上午|早上|中午|下午|晚上|傍晚)?\\s*(\\d{1,2})(?:[:：](\\d{2})|\\s*点\\s*(?:(半)|(\\d{1,2})\\s*分?)?)';
  take(new RegExp(T + '\\s*(?:到|至|-|~|–)\\s*' + T), (_, p1, h1, m1, hf1, mm1, p2, h2, m2, hf2, mm2) => { r.time = tm(p1, h1, m1 || mm1, hf1); r.end = tm(p2 || p1, h2, m2 || mm2, hf2); });
  if (!r.time) take(new RegExp(T), (_, p, h, m, hf, mm) => { r.time = tm(p, h, m || mm, hf); });
  // kind
  if (/考试|期中|期末|midterm|final exam|\bexam\b|测验|quiz/i.test(text)) r.kind = 'exam';
  else if (/截止|ddl|due|deadline|交(?!流|通)/i.test(text)) r.kind = 'deadline';
  else if (r.time) r.kind = 'event';
  r.title = s.replace(/\s+/g, ' ').replace(/^[\s,，。、:：]+|[\s,，。、:：]+$/g, '').trim();
  const tags = settings().tags;
  r.tags = r.tagNames.map(n => (tags.find(x => x.name.toLowerCase() === n.toLowerCase()) || {}).id || ('new:' + n));
  return r;
}
function describeParsed(r){
  const bits = [];
  if (r.rep){ const map = {daily:'每天', weekdays:'每个工作日', biweekly:'每两周', monthly: `每月 ${r.rep.dom} 号`}; bits.push(r.rep.type === 'weekly' ? `每周${(r.rep.days.length ? r.rep.days : [monIdx(r.date || today())]).map(d => WDN[d].slice(1)).join('')}` : map[r.rep.type]); if (r.until) bits.push('到 ' + cnd(r.until)); }
  if (r.date) bits.push(cnd(r.date) + ' ' + wdName(r.date)); else if (!r.rep) bits.push('放进任务池');
  if (r.time) bits.push(r.time + (r.end ? '–' + r.end : ''));
  if (r.hours) bits.push(fmtH(r.hours));
  if (r.kind && r.kind !== 'task') bits.push(KIND[r.kind]);
  r.tagNames.forEach(n => bits.push('#' + n));
  return bits.concat(r.bits).join(' · ');
}
function repeatDates(r){
  const start = r.date || today();
  const until = r.until || add(start, r.rep.type === 'daily' || r.rep.type === 'weekdays' ? 30 : 90);
  const out = [];
  for (let d = start; d <= until && out.length < 120; d = add(d, 1)){
    const wd = monIdx(d);
    const ok = r.rep.type === 'daily' || (r.rep.type === 'weekdays' && wd < 5)
      || (r.rep.type === 'weekly' && (r.rep.days.length ? r.rep.days : [monIdx(start)]).includes(wd))
      || (r.rep.type === 'biweekly' && diff(start, d) % 14 === 0)
      || (r.rep.type === 'monthly' && parse(d).getDate() === r.rep.dom);
    if (ok) out.push(d);
  }
  return out;
}
function ensureTags(ids){
  const s = settings(); let tags = s.tags.slice(); let changed = false;
  const res = ids.map(id => { if (!id.startsWith('new:')) return id; const name = id.slice(4); const nid = uid('t'); tags.push({id:nid, name, color: COLORS[tags.length % COLORS.length][1], due:false}); changed = true; return nid; });

}
function createFromParsed(r, overrides = {}){
  const tg = ensureTags(r.tags);

    const rep = uid('r'); const dates = repeatDates({...r, date: overrides.date !== undefined && overrides.date ? overrides.date : r.date});

    commit(changes, `已添加 ${dates.length} 次重复日程`);
  } else {
    const date = overrides.date !== undefined ? overrides.date : (r.date || null);
    changes.push({col:'items', id: uid('i'), data: {...base, date}});
    commit(changes, date ? `已添加到 ${cnd(date)}` : '已放进任务池');

}

/* ---------- progress model ----------
   log   {date: hours actually spent}            -> "投入" (effort)
   hours remaining estimate                     -> what is still left
   est   original estimate                      -> project size, speed ratios
   burn  {date: remaining hours retired}        -> "进展" (progress toward the plan), drives pace and rings
   finRem remaining at the moment it was ticked -> lets "un-complete" restore it exactly */
function addBurn(b, d, v){ if (!d || Math.abs(v) < 1e-6) return b; const n = r2((Number(b[d])||0) + v); if (n > 1e-6) b[d] = n; else delete b[d]; return b; }
function burnOf(raw){
  if (raw.burn) return {...raw.burn};
  // older items: progress made before burns existed shows up as est > hours
  const b = {}, est = raw.est != null ? Number(raw.est)||0 : Number(raw.hours)||0, pre = raw.done ? 0 : Math.max(0, est - (Number(raw.hours)||0));
  if (pre > 1e-6){ const lg = raw.log || {}, tot = sum(Object.values(lg).map(Number)); if (tot > 0) for (const [d,h] of Object.entries(lg)) addBurn(b, d, pre * Number(h)/tot); else addBurn(b, today(), pre); }
  return b;
}
// change the remaining estimate; a drop counts as progress today, a rise first cancels today's progress
function remPatch(raw, rem, t = today()){
  const old = Number(raw.hours)||0, burn = burnOf(raw);
  if (rem < old - 1e-6) addBurn(burn, t, old - rem);
  else if (rem > old + 1e-6) addBurn(burn, t, -Math.min(Number(burn[t])||0, rem - old));
  return { hours: r2(Math.max(0, rem)), burn };
}
const needsReest = i => i.kind === 'task' && !i.done && i.hours <= 1e-6 && (i.est > 0 || Object.keys(i.log || {}).length > 0);
function setRemaining(id, rem, label){
  const raw = S.items[id]; if (!raw) return;
  if (rem <= 1e-6){ finishItem(id, 0); return; }
  put('items', id, {...raw, ...remPatch(raw, rem)}, label || `还剩 ${fmtH(rem)}`);
}
/* record partial progress: today's spent time + a corrected remaining estimate, decoupled */
function logProgress(id){
  const it = S.items[id]; if (!it || it.done) return;
  const t = today();
  const spentToday = Number((it.log||{})[t]) || 0;
  const reest = !(Number(it.hours) > 0);
  openSheet(`<h2>记录进度<button class="x" type="button" data-close aria-label="关闭">×</button></h2>
    <p style="margin:0">「${esc(it.title)}」${reest ? '<br><span class="hint">还没完成，但剩余记成了 0，请重新估一下还要多久。</span>' : ''}</p>
    <label style="display:block;margin-top:10px">今天投入了多久（小时，全天合计）<input class="inp" type="number" min="0" step="0.25" id="pg-spent" value="${spentToday || ''}" placeholder="0" style="width:100%;margin-top:4px"></label>
    <label style="display:block;margin-top:10px">还需要大约多久（小时，可以直接改）<input class="inp" type="number" min="0" step="0.25" id="pg-rem" value="${reest ? '' : (it.hours || '')}" placeholder="${reest ? '例如 0.5' : ''}" style="width:100%;margin-top:4px"></label>
    <p class="meta" style="margin:6px 0 0">投入和剩余是两件事：花了多久不代表剩下的估计也要跟着减，按实际感觉改就行。剩余填 0 就是完成。</p>
    <div class="actions"><button class="ghost" type="button" data-close>取消</button><button class="primary" type="button" id="pg-ok">保存</button></div>`);
  $('#pg-ok').addEventListener('click', () => {
    const spent = Math.max(0, Number($('#pg-spent').value) || 0);
    const remRaw = $('#pg-rem').value;
    if (reest && remRaw === ''){ toast('先填还需要多久，或者填 0 表示完成'); return; }
    const rem = Math.max(0, Number(remRaw) || 0);
    const log = {...(it.log||{})}; if (spent > 1e-6) log[t] = r2(spent); else delete log[t];
    const actual = r2(logSum({log})) || (it.actual ?? null);
    const base = {...it, log, actual};
    closeSheet();
    if (rem <= 1e-6){ const old = Number(it.hours)||0; const burn = addBurn(burnOf(it), t, old); put('items', id, {...base, hours:0, burn, finRem: old, done:true, doneOn:t}, `已完成「${it.title}」`); return; }
    put('items', id, {...base, ...remPatch(it, rem, t)}, spent > 1e-6 ? `今天投入 ${fmtH(spent)}，还剩 ${fmtH(rem)}` : `已更新剩余 ${fmtH(rem)}`);
  });
}
/* complete; delta = extra time spent that isn't in the log yet */
function finishItem(id, delta){
  const it = S.items[id]; if (!it) return;
  const t = today();
  const d = Math.max(0, Number(delta) || 0);
  const log = d > 1e-6 ? {...(it.log||{}), [t]: r2((Number((it.log||{})[t]) || 0) + d)} : (it.log || {});
  const actual = r2(logSum({log}) ) || (it.actual ?? null);
  const old = Number(it.hours)||0;
  const burn = addBurn(burnOf(it), t, old);
  put('items', id, {...it, done:true, doneOn: t, hours:0, finRem: old, burn, log, actual}, `已完成「${it.title}」`);
}
function reopenItem(id){
  const raw = S.items[id]; if (!raw) return;
  const {finRem, ...rest} = raw;
  let hours = Number(raw.hours)||0;

/* capacity-aware reschedule. Rules match the pacing math:

      if (date){
        status = 'late';

// "Reading 3" before "Reading 12", "第2章" before "第10章"; tasks without numbers keep the order they were added
const numCmp = new Intl.Collator('zh', {numeric:true, sensitivity:'base'});

const cnOrd = t => t.replace(/第([一二三四五六七八九十百]+)([章节课讲篇])/g, (m, n, u) => `第${cnNum(n)}${u}`);

function autoSchedule(pid, mid){
  const p = derive().projMap.get(pid); if (!p) return;
  const t = today(), a = allocate(t).byProj[pid] || {};

  const tasks = scoped.sort((x,y) => { const mi = m => { const k = p.modules.findIndex(z => z.id === m); return k < 0 ? 999 : k; }; return (mi(x.module) - mi(y.module)) || taskOrder(x, y); });
  const days = Object.keys(a).filter(d => d >= t).sort();
  if (!days.length){ toast('这个项目没有可排的日子：检查 Deadline 和每天可投入的时间'); return; }
  // spread tasks along the cumulative allocation curve, after work already on the calendar
  const cum = []; let c = 0; for (const d of days){ c += a[d]; cum.push(c); }
  let pos = sum(projTasks(pid).filter(i => !i.done && i.date && i.date >= t).map(i => i.hours));

  for (const it of tasks){
    const h = it.hours || 0.5, mp = pos + h/2;
    let k = cum.findIndex(v => v >= mp - 1e-6); if (k < 0) k = days.length - 1;
    changes.push({col:'items', id: it.id, data:{...S.items[it.id], date: days[k]}});
    pos += h;
  }

function stopTimer(silent){

    const actual = r2(logSum({log}));

        <div class="inline"><input class="inp" type="number" min="0" step="0.25" id="tm-custom" placeholder="还需几小时" style="width:130px"><button class="ghost" type="button" id="tm-ok">记录</button></div>

\`\`\``;

// tolerant parser: JSON (with or without code fences / extra text), or "## 模块" + "- 任务 | 1.5h" lines
function parseBreakdown(txt){
  const raw = String(txt || '').trim(); if (!raw) return null;
  const tryJSON = s => { try { return JSON.parse(s); } catch(e){ return null; } };
  let obj = null;
  const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) obj = tryJSON(fence[1].trim());
  if (!obj){ const a = raw.indexOf('{'), b = raw.lastIndexOf('}'); if (a >= 0 && b > a) obj = tryJSON(raw.slice(a, b + 1).replace(/[“”]/g, '"').replace(/,\s*([}\]])/g, '$1')); }
  if (obj && Array.isArray(obj.modules)){
    const mods = obj.modules.filter(m => m && m.name && Array.isArray(m.tasks)).map(m => ({name: String(m.name).slice(0,60), tasks: m.tasks.filter(x => x && x.title).map(x => ({title: String(x.title).slice(0,120), hours: Math.max(0, Number(x.hours) || 0)}))})).filter(m => m.tasks.length);
    return mods.length ? {mods, note: obj.note || ''} : null;
  }
  const mods = []; let cur = null;
  for (const line of raw.split('\n').map(l => l.trim()).filter(Boolean)){
    const h = line.match(/^#{1,4}\s*(.+)$/) || line.match(/^(?:模块|Module)\s*[:：]?\s*(.+)$/i);
    if (h){ cur = {name: h[1].replace(/[*_]/g,'').trim(), tasks: []}; mods.push(cur); continue; }
    const t = line.match(/^(?:[-*•]|\d+[.)])\s*(.+?)(?:\s*[|｜,，·]\s*|\s+)(\d+(?:\.\d+)?)\s*(?:h|小时|hrs?)?\s*$/i);
    if (t){ if (!cur){ cur = {name:'任务', tasks: []}; mods.push(cur); } cur.tasks.push({title: t[1].replace(/[*_]/g,'').trim(), hours: Number(t[2])}); }
  }
  const ok = mods.filter(m => m.tasks.length);
  return ok.length ? {mods: ok, note: ''} : null;
}
function showBreakdown(out, pid, mods, note){

async function deliver(filename, data, mime){
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e){}
  if (dl){ try { await dl.save({filename, data: new Blob([data], {type: mime})}); toast(`已下载 ${filename}`); return; } catch(e){ if (e && e.code === 'declined') { toast('已取消下载'); return; } } }
  const fb = $('#export-fallback');
  if (fb){ fb.innerHTML = `<div class="card"><p class="hint" style="margin:0">这里没法直接下载。全选下面的内容复制，存成 <b>${esc(filename)}</b>。</p><textarea class="inp" style="min-height:200px;font-family:var(--f-mono);font-size:12px" readonly id="fb-text">${esc(data)}</textarea><div class="inline"><button class="ghost" type="button" id="fb-copy">复制</button></div></div>`; $('#fb-copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(data); toast('已复制'); } catch(e){ $('#fb-text').select(); } }); fb.scrollIntoView({behavior:'smooth'}); }
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
function exportData(kind){
  const dv = derive(), s = settings(), t = today();
  const from = ($('#ex-from') || {}).value || add(t, -30), to = ($('#ex-to') || {}).value || add(t, 90);
  const rows = dv.items.filter(i => i.date && i.date >= from && i.date <= to).sort((a,b) => a.date.localeCompare(b.date) || sortItems(a,b));
  const pn = id => (dv.projMap.get(id) || {}).name || '';
  const mn = (pid, mid) => ((dv.projMap.get(pid) || {modules:[]}).modules.find(m => m.id === mid) || {}).name || '';
  const tn = ids => ids.map(id => (s.tags.find(x => x.id === id) || {}).name).filter(Boolean).join(' ');

    const head = ['日期','开始','结束','事项','类型','项目','模块','标签','预计用时（小时）','实际用时（小时）','完成','备注'];
    const lines = [head, ...rows.map(i => [i.date, i.time, i.end, i.title, KIND[i.kind], pn(i.project), mn(i.project, i.module), tn(i.tags), i.est || '', i.actual ?? '', i.done ? '是' : '否', i.note])].map(r => r.map(csvCell).join(','));

  }
  if (kind === 'ics'){
    const icsEsc = v => String(v || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const ev = rows.map(i => { const d = i.date.replace(/-/g,''); const lines = ['BEGIN:VEVENT', `UID:${i.id}@runway`, `DTSTAMP:${stamp}`]; if (i.time){ lines.push(`DTSTART:${d}T${i.time.replace(':','')}00`); const endT = i.end || (() => { const [H,Mi] = i.time.split(':').map(Number); const m = H*60 + Mi + Math.round((i.hours || 1)*60); return `${pad(Math.min(23, Math.floor(m/60)))}:${pad(m%60)}`; })(); lines.push(`DTEND:${d}T${endT.replace(':','')}00`); } else { lines.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${add(i.date,1).replace(/-/g,'')}`); } lines.push(`SUMMARY:${icsEsc((i.done ? '✓ ' : '') + i.title)}`); const desc = [pn(i.project) && '项目：' + pn(i.project), i.est && '预计 ' + fmtH(i.est), i.note].filter(Boolean).join('\n'); if (desc) lines.push(`DESCRIPTION:${icsEsc(desc)}`); lines.push('END:VEVENT'); return lines.join('\r\n'); });
    deliver(`Runway-${from}至${to}.ics`, ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Runway//CN','X-WR-CALNAME:Runway', ...ev, 'END:VCALENDAR'].join('\r\n'), 'text/calendar'); return;
  }
  if (kind === 'md'){
    const pid = ($('#ex-proj') || {}).value;
    const ps = pid ? [dv.projMap.get(pid)] : dv.projects;
    const md2 = ps.map(p => { const st = projStatus(p); const ts = projTasks(p.id); const mods = [...p.modules, {id:'', name:'其他'}]; return `# ${p.name}\n\nDeadline ${p.deadline} · 共 ${fmtH(st.total)} · 剩 ${fmtH(st.rem)} · ${st.label}\n\n` + mods.map(m => { const list = ts.filter(i => (i.module || '') === m.id || (!m.id && !p.modules.some(x => x.id === i.module))); if (!list.length) return ''; return `## ${m.name}\n\n` + list.map(i => `- [${i.done ? 'x' : ' '}] ${i.title} · 预计 ${fmtH(i.est)}${i.date ? ' · 排在 ' + i.date : ''}${i.actual != null ? ' · 实际 ' + fmtH(i.actual) : ''}`).join('\n') + '\n'; }).join('\n'); }).join('\n\n');
    deliver(`Runway-${pid ? dv.projMap.get(pid).name : '项目清单'}.md`, md2 || '还没有计划项目。', 'text/markdown'); return;
  }
  if (kind === 'json'){ deliver(`Runway-backup-${t}.json`, JSON.stringify({app:'runway', version:2, exportedAt: new Date().toISOString(), items:S.items, projects:S.projects, notes:S.notes, settings:S.settings}, null, 1), 'application/json'); }
}

/* ================= toast ================= */
let toastTimer, toastHideTimer;
function hideToast(){
  const el = $('#toast'); if (el.hidden) return;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){ el.hidden = true; return; }
  el.classList.add('leaving');
  clearTimeout(toastHideTimer);
  toastHideTimer = setTimeout(() => { el.hidden = true; el.classList.remove('leaving'); }, 180);
}
function toast(msg, undoFn){
  if (!msg) return;
  const el = $('#toast'); clearTimeout(toastHideTimer); el.classList.remove('leaving');
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button type="button" id="toast-undo">撤销</button>' : ''}`; el.hidden = false;
  if (undoFn) $('#toast-undo').onclick = () => { hideToast(); undoFn(); };

/* ================= pointer drag & drop (mouse + touch via handle / long-press) ================= */
const drag = { id:null, src:null, ghost:null, startX:0, startY:0, active:false, timer:null, over:null, pointerId:null };
document.addEventListener('pointerdown', e => {
  const ch = e.target.closest('[data-drag]'); if (!ch || e.button > 0) return;
  if (ch.classList.contains('ext')) return;
  const isTouch = e.pointerType !== 'mouse';
  if (isTouch && !e.target.closest('.handle')) { // long-press elsewhere
    drag.timer = setTimeout(() => beginDrag(e, ch), 350);
  }
  drag.id = ch.dataset.drag; drag.src = ch; drag.startX = e.clientX; drag.startY = e.clientY; drag.pointerId = e.pointerId;
  if (isTouch && e.target.closest('.handle')) beginDrag(e, ch);
});
function beginDrag(e, ch){
  clearTimeout(drag.timer); if (drag.active) return;
  drag.active = true; document.body.classList.add('is-dragging');
  const g = ch.cloneNode(true); g.classList.add('ghost-drag'); g.style.width = Math.min(240, ch.offsetWidth) + 'px'; document.body.appendChild(g); drag.ghost = g;
  ch.classList.add('dragging-src'); moveGhost(drag.startX, drag.startY);
}
function moveGhost(x, y){ if (drag.ghost){ drag.ghost.style.left = (x + 8) + 'px'; drag.ghost.style.top = (y + 8) + 'px'; } }
document.addEventListener('pointermove', e => {
  if (!drag.id || e.pointerId !== drag.pointerId) return;
  const dist = Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY);
  if (!drag.active){ if (e.pointerType === 'mouse' && dist > 5) beginDrag(e, drag.src); else if (dist > 10){ clearTimeout(drag.timer); drag.id = null; } if (!drag.active) return; }
  e.preventDefault(); moveGhost(e.clientX, e.clientY);
  drag.ghost.style.display = 'none'; const under = document.elementFromPoint(e.clientX, e.clientY); drag.ghost.style.display = '';
  const z = under && under.closest('[data-drop]');
  if (drag.over && drag.over !== z) drag.over.classList.remove('drop-hot');
  if (z){ z.classList.add('drop-hot'); drag.over = z; } else drag.over = null;
}, {passive:false});
document.addEventListener('touchmove', e => { if (drag.active) e.preventDefault(); }, {passive:false});
function endDrag(e, cancel){
  clearTimeout(drag.timer);
  if (drag.active){
    const z = drag.over; const id = drag.id;
    if (drag.ghost) drag.ghost.remove(); if (drag.src) drag.src.classList.remove('dragging-src');
    document.body.classList.remove('is-dragging'); if (z) z.classList.remove('drop-hot');
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    if (!cancel && z && id){ const tgt = z.dataset.drop; moveItem(id, tgt === 'pool' ? null : tgt); }
  }
  Object.assign(drag, {id:null, src:null, ghost:null, active:false, over:null, timer:null, pointerId:null});
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
// phone: tapping a pool chip opens the date picker instead of the editor
document.addEventListener('click', e => { const ch = e.target.closest('#pool .chip[data-item]'); if (ch && window.innerWidth <= 820){ e.stopPropagation(); pickDate(ch.dataset.item); } }, true);

/* day rollover */
let lastDay = today();
setInterval(() => { if (today() !== lastDay){ lastDay = today(); ver++; render(); } }, 60000);

render();
initStore();
})();
</script>
