<title>Runway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: today on the left (now card, next, all), project drawer on the right; on phones the drawer is a bottom sheet. Tokens follow DESIGN.md. */
:root{
  --paper:#F3F3F0; --card:#FFFFFF; --sunk:#E9E9E5; --line:#DADAD4; --ink:#15171C; --muted:#6B6E76;
  --signal:#1F3BE0; --signal-soft:#E3E7FC; --on-signal:#FFFFFF;
  --good:#2F6B3F; --tight:#8A6110; --short:#A2412A;
  --scrim:rgba(21,23,28,.32); --ground:#CFCFC7; --lamp-off:#E2E2DC; --tarmac:#ECECE7; --centre:#D6D6CF; --glow:0 0 0; --lift:0 1px 2px rgba(21,23,28,.05),0 14px 34px -14px rgba(31,59,224,.28);
  --f-text:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121316; --card:#1B1D21; --sunk:#24272C; --line:#30333A; --ink:#ECEDEF; --muted:#9A9DA5;
  --signal:#7B8CFF; --signal-soft:#252B4D; --on-signal:#0F1118;
  --good:#79C49A; --tight:#D8B260; --short:#E78C69;
  --scrim:rgba(0,0,0,.55); --ground:#3A3D44; --lamp-off:#2A2D33; --tarmac:#17191D; --centre:#2C2F36; --glow:0 0 7px; --lift:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(123,140,255,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121316; --card:#1B1D21; --sunk:#24272C; --line:#30333A; --ink:#ECEDEF; --muted:#9A9DA5;
  --signal:#7B8CFF; --signal-soft:#252B4D; --on-signal:#0F1118;
  --good:#79C49A; --tight:#D8B260; --short:#E78C69;
  --scrim:rgba(0,0,0,.55); --ground:#3A3D44; --lamp-off:#2A2D33; --tarmac:#17191D; --centre:#2C2F36; --glow:0 0 7px; --lift:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(123,140,255,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

#app{max-width:1200px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:26px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:7px}
.brand::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--signal)}
.layers{display:flex;gap:2px;background:var(--sunk);border-radius:8px;padding:3px}
.layers button{border:0;background:none;padding:4px 14px;border-radius:6px;color:var(--muted);font-size:14px}
.layers button[aria-current]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.exam{margin-left:auto;display:flex;align-items:baseline;gap:5px;font-size:13px;color:var(--muted)}
.exam b{font-size:22px;font-weight:500;color:var(--ink);letter-spacing:-.02em}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.today{display:flex;flex-direction:column;gap:26px;min-width:0}

/* day header */
.dayhead{display:flex;flex-direction:column;gap:8px}
.dayhead h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.tally{margin:0;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px}
.tally b{color:var(--ink);font-weight:500;font-size:15px;margin:0 2px}
.tally .sep{width:1px;height:12px;background:var(--line);margin:0 8px;align-self:center}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;max-width:420px}
.meter i{display:block;height:100%;background:var(--signal);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.soft{margin:0;font-size:13px;color:var(--muted)}

/* now card: the one loud thing on the page */
.now{background:var(--card);border-radius:14px;padding:22px 24px 20px;box-shadow:var(--lift);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;outline:1.5px solid color-mix(in srgb,var(--signal) 22%,transparent);outline-offset:-1.5px}
.now-label{font-size:12px;letter-spacing:.12em;color:var(--signal);font-weight:500}
.now h2{font-size:26px;font-weight:700;letter-spacing:-.015em;line-height:1.3}
.now .lin{margin:0;font-size:13px;color:var(--muted)}
.now .est{margin:2px 0 0;font-size:13px;color:var(--muted)}
.now .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.now.empty{box-shadow:none;outline-color:var(--line)}
.clock{font-size:56px;font-weight:500;letter-spacing:-.04em;line-height:1.05;margin-top:10px;color:var(--signal)}
/* runway centreline: dashes the timer fills in */
.track{height:6px;border-radius:3px;margin-top:6px;background:repeating-linear-gradient(90deg,var(--sunk) 0 18px,transparent 18px 28px);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--signal);border-radius:3px;transition:width 1s linear}

.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:6px}
.btn.quiet:hover{color:var(--ink)}
.btn:active{transform:scale(.97)}

/* lists */
.block{display:flex;flex-direction:column;gap:4px}
.block h3{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.fold{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--muted)}
.fold:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
.fold span{font-size:12px}
.fold svg{transition:transform .15s}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row-t{display:flex;flex-direction:column;min-width:0}
.row-t span{overflow-wrap:anywhere}
.row-t small{font-size:12px;color:var(--muted)}
.row-m{font-size:13px;color:var(--muted);white-space:nowrap}
.row.done .row-t span{text-decoration:line-through;color:var(--muted)}
.row.event .row-t span{color:var(--muted)}
.dotslot{width:6px;height:6px;border-radius:50%;background:var(--line);justify-self:center}
.check{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;background:var(--card);transition:background .15s,border-color .15s}
.check:checked{background:var(--signal);border-color:var(--signal);animation:pop .3s ease}
.check:checked::after{content:"";width:5px;height:9px;border:solid var(--on-signal);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{50%{transform:scale(1.2)}}

.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap;color:var(--muted)}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.mini.signal{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 40%,var(--line))}
.mini.signal:hover{background:var(--signal);color:var(--on-signal);border-color:var(--signal)}

/* drawer */
.drawer{background:var(--card);border:1px solid var(--line);border-radius:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.drawer-handle{display:none}
.drawer-hd{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drawer-hd h2{font-size:18px;font-weight:700}
.drawer-hd p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.groups{overflow:auto;padding:4px 20px 16px}
.grp{padding:14px 0 8px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp header{display:flex;align-items:center;gap:8px}
.grp header b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}
.grp-sub{margin:2px 0 6px 17px;font-size:12px;color:var(--muted)}
.grp-none{margin:0 0 6px 17px;font-size:12px;color:var(--muted)}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.tight{color:var(--tight);background:color-mix(in srgb,var(--tight) 15%,transparent)}
.pill.short{color:var(--short);background:color-mix(in srgb,var(--short) 14%,transparent)}
.pill.flat{color:var(--muted);background:var(--sunk)}
.items{list-style:none;margin:0;padding:0 0 0 17px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.it:first-child{border-top:0}
.it-t{flex:1;min-width:0;display:flex;flex-direction:column}
.it-t span{font-size:14px;overflow-wrap:anywhere}
.it-t small{font-size:12px;color:var(--muted)}
.it-a{display:flex;gap:6px;flex:none}

/* picker sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s ease}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--card);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet h2{font-size:17px;font-weight:700}
.x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);width:32px;height:32px;border-radius:8px;flex:none}
.x:hover{background:var(--sunk)}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.day{width:100%;display:grid;grid-template-columns:96px minmax(0,1fr) 92px;gap:12px;align-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px;text-align:left}
.day:hover{background:var(--sunk)}
.day .d{font-size:14px}
.day .r{font-size:12px;color:var(--muted);text-align:right}
.day.fits .r{color:var(--good)}
.day.late .d,.day.late .load{opacity:.45}
.load{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.load i{display:block;height:100%;background:color-mix(in srgb,var(--ink) 55%,transparent);border-radius:3px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;display:flex;gap:14px;align-items:center;font-size:13px;z-index:60;max-width:calc(100% - 32px);animation:rise .2s ease}
.toast button{border:0;background:none;color:var(--signal-soft);font-weight:500;padding:0}
.grove-today{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.grove-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grove-hd h3{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em}
.grove-hd>span{font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:4px}
.grove-hd b{color:var(--ink);font-weight:500;font-size:15px}
.grove-hd .sep{width:1px;height:12px;background:var(--line);margin:0 8px;align-self:center}
.grove-empty{padding:6px 0 2px}
/* runway lights: one lamp is 10 minutes; a part-lit lamp fills from the bottom */
.lamp{display:block;width:var(--lw,9px);height:var(--lh,18px);border-radius:3px;flex:none;
  background:linear-gradient(to top,var(--c) var(--f),var(--lamp-off) var(--f));box-shadow:var(--glow) color-mix(in srgb,var(--c) 70%,transparent)}
.lamp.est{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.stack .lamp.est{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}
.lamp.on{animation:lampOn .45s ease both;animation-delay:var(--d,0ms)}
@keyframes lampOn{0%{opacity:0;transform:scaleY(.3)}60%{opacity:1;filter:brightness(1.5)}100%{transform:none;filter:none}}
.sess{display:flex;gap:3px;flex-wrap:wrap}
.strip{--lw:12px;--lh:26px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:12px 12px 14px;border-radius:10px;background:var(--tarmac);
  background-image:repeating-linear-gradient(90deg,var(--centre) 0 14px,transparent 14px 24px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 calc(100% - 5px)}
.week .grove-hd{margin-bottom:10px}
.weekgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.stack{--lw:100%;width:min(40px,100%);display:flex;flex-direction:column-reverse;gap:var(--lg,2px);min-height:40px;justify-content:flex-start;padding-bottom:3px;border-bottom:1.5px solid var(--ground)}
.stack .sess{flex-direction:column-reverse;gap:var(--lg,2px)}
.stack .lamp{border-radius:1.5px;background:linear-gradient(to right,var(--c) var(--f),var(--lamp-off) var(--f))}
.wd{font-size:12px;color:var(--muted)}
.wh{font-size:12px}
.wday.is-today .wd{color:var(--signal);font-weight:500}
.legend{margin-top:8px;font-size:12px}
/* a project's own runway: lit up to the share already invested */
.prun{height:6px;margin:0 0 8px 17px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--lamp-off) 0 6px,transparent 6px 9px);position:relative;overflow:hidden}
.prun i{position:absolute;inset:0 auto 0 0;width:var(--p);background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 9px)}
.savestate{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.savestate.live i{background:var(--good)}
.savestate.memory i,.savestate.error i{background:var(--short)}
.problem{margin:-10px 0 18px;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--short) 10%,var(--card));color:var(--ink);font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.problem button{border:0;background:none;color:var(--signal);font-size:13px;padding:0}
.loading{color:var(--muted);padding:40px 0}
.legend-chips{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend-chips li{display:flex;align-items:center;gap:6px}
.legend-chips i{width:9px;height:9px;border-radius:2px}
.legend-chips span{color:var(--ink)}
button.swatch{border:0;padding:0;cursor:pointer;outline-offset:2px}
button.swatch:hover{transform:scale(1.25)}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px 17px}
.palette button{width:22px;height:22px;border-radius:6px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.palette button[aria-pressed="true"]{border-color:var(--ink)}
.quick{margin:12px 20px 4px;display:flex;flex-direction:column;gap:6px}
.quick input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
.quick input:focus{outline:2px solid color-mix(in srgb,var(--signal) 40%,transparent);border-color:var(--signal)}
.quick-row{display:flex;align-items:center;gap:6px}
.quick-row .soft{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin.note{font-style:normal;color:var(--muted)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.col{flex-direction:column;align-items:stretch}
.filebtn{position:relative;overflow:hidden;text-align:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sheet p{margin:0}
.empty-app{max-width:520px;padding:40px 0;display:flex;flex-direction:column;gap:14px}
.empty-app h1{font-size:26px}
.empty-app p{margin:0;color:var(--muted)}
.foot{margin:40px 0 0;font-size:12px;color:var(--muted);max-width:60ch}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}

/* phone: drawer becomes a bottom sheet you pull up */
@media (max-width:860px){
  #app{padding-bottom:96px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .bar{margin-bottom:20px}
  .exam{margin-left:0}
  .dayhead h1{font-size:26px}
  .now{padding:18px 18px 16px}
  .now h2{font-size:22px}
  .clock{font-size:46px}
  .drawer{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:82vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:30;box-shadow:0 -10px 40px -16px rgba(0,0,0,.3);
    transform:translateY(calc(100% - 58px - env(safe-area-inset-bottom,0px)));transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
  .drawer.open{transform:none}
  .drawer-handle{display:flex;align-items:center;gap:10px;border:0;background:none;padding:16px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));width:100%;text-align:left}
  .drawer-handle span{flex:1;font-size:13px;color:var(--muted)}
  .drawer-handle svg{transition:transform .2s}
  .drawer.open .drawer-handle svg{transform:rotate(180deg)}
  .drawer-hd{display:none}
  .quick{margin:0 max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px))}
  .groups{padding:0 max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
  .it{align-items:flex-start}
  .it-a{padding-top:2px}
  .row{grid-template-columns:20px minmax(0,1fr) auto}
  .row .mini{grid-column:2 / -1;justify-self:start}
  .day{grid-template-columns:84px minmax(0,1fr) 84px}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div id="app"></div>
<script>/*BUNDLE*/</script>
