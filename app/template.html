<title>Runway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: Analogue Keeper style memo pads on a desk: header, now and tasks pads | a long sky-blue timetable pad; the week pad below; the sand project drawer on the right. Phones: one column, drawer as a bottom sheet. Tokens follow DESIGN.md. */
:root{
  --desk:#E6EEEC; --paper:#FFFEFA; --card:#FFFFFF; --sunk:#EEF1EF; --line:#E2E6E3; --rule:#E2E6E3; --ink:#14171A; --muted:#6B7470;
  --hl:46%; --hl-est:38%;
  --desk:#EDECE8; --ink:#2A2D2E; --muted:#73787A;
  --cream:#FBFAF6; --cream-b:#EFEDE6; --cream-l:#E4E1D8;
  --butter:#F4F0D6; --butter-b:#E9E2B6; --butter-l:#DED6A6;
  --sage:#E1EBE2; --sage-b:#CFDECF; --sage-l:#C1D4C3;
  --sky:#E0E8F1; --sky-b:#CCD9E8; --sky-l:#BFCFE2;
  --lilac:#E8E5EE; --lilac-b:#D8D3E2; --lilac-l:#CBC5D8;
  --sand:#F2ECE1; --sand-b:#E6DCCB; --sand-l:#DACDB7;
  --signal:#1F3BE0; --signal-soft:#E4E8FD; --on-signal:#FFFFFF;
  --good:#2F6B3F; --tight:#8A6110; --short:#A2412A;
  --scrim:rgba(17,19,24,.32); --ground:#CBD1D9; --plan:rgba(17,19,24,.28);
  --lift:0 1px 2px rgba(17,19,24,.04),0 12px 32px -12px rgba(17,19,24,.14);
  --lift-signal:0 1px 2px rgba(17,19,24,.04),0 16px 36px -16px rgba(31,59,224,.35);
  --f-display:"Jost","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-text:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-hand:"Gaegu","Noto Sans SC","PingFang SC",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1211; --paper:#181C1B; --card:#1D2221; --sunk:#232A28; --line:#2C3331; --rule:#2C3331; --ink:#EDF0EE; --muted:#97A19D;
  --hl:64%; --hl-est:44%;
  --desk:#121313; --ink:#ECEDEA; --muted:#9DA2A0;
  --cream:#1C1D1C; --cream-b:#252725; --cream-l:#2F322F;
  --butter:#24231A; --butter-b:#2E2C1F; --butter-l:#3A3726;
  --sage:#1B231D; --sage-b:#222C24; --sage-l:#2C382E;
  --sky:#1A2028; --sky-b:#212833; --sky-l:#2B3442;
  --lilac:#201E26; --lilac-b:#282530; --lilac-l:#33303D;
  --sand:#24211C; --sand-b:#2D2922; --sand-l:#39342B;
  --signal:#8A98FF; --signal-soft:#232A52; --on-signal:#0E1020;
  --good:#79C49A; --tight:#D8B260; --short:#E78C69;
  --scrim:rgba(0,0,0,.55); --ground:#3A3F48; --plan:rgba(238,240,243,.32);
  --lift:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  --lift-signal:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(131,146,255,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1211; --paper:#181C1B; --card:#1D2221; --sunk:#232A28; --line:#2C3331; --rule:#2C3331; --ink:#EDF0EE; --muted:#97A19D;
  --hl:64%; --hl-est:44%;
  --desk:#121313; --ink:#ECEDEA; --muted:#9DA2A0;
  --cream:#1C1D1C; --cream-b:#252725; --cream-l:#2F322F;
  --butter:#24231A; --butter-b:#2E2C1F; --butter-l:#3A3726;
  --sage:#1B231D; --sage-b:#222C24; --sage-l:#2C382E;
  --sky:#1A2028; --sky-b:#212833; --sky-l:#2B3442;
  --lilac:#201E26; --lilac-b:#282530; --lilac-l:#33303D;
  --sand:#24211C; --sand-b:#2D2922; --sand-l:#39342B;
  --signal:#8A98FF; --signal-soft:#232A52; --on-signal:#0E1020;
  --good:#79C49A; --tight:#D8B260; --short:#E78C69;
  --scrim:rgba(0,0,0,.55); --ground:#3A3F48; --plan:rgba(238,240,243,.32);
  --lift:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  --lift-signal:0 1px 2px rgba(0,0,0,.3),0 16px 40px -16px rgba(131,146,255,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--f-text);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.soft{margin:0;font-size:13px;color:var(--muted)}

#app{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-bottom:20px}
.brand{font:600 19px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand::before{content:"";width:22px;height:10px;background:repeating-linear-gradient(90deg,var(--signal) 0 5px,transparent 5px 8.5px);border-radius:2px}
.layers{display:flex;gap:2px;background:var(--paper);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.layers button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--muted);font-size:14px}
.layers button:hover{color:var(--ink)}
.layers button[aria-current]{background:var(--ink);color:var(--paper);font-weight:500}
.savestate{margin-left:auto}
.exam{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.exam b{font:600 26px/1 var(--f-display);letter-spacing:-.03em;color:var(--ink)}
.savestate{border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px 12px 4px 10px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.savestate.live i{background:var(--good)}
.savestate.memory i,.savestate.error i{background:var(--short)}
.problem{margin:-6px 0 16px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--short) 10%,var(--card));font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.problem button{border:0;background:none;color:var(--signal);font-size:13px;padding:0}
.loading{color:var(--muted);padding:48px 0}

/* hero: today's runway */
.hero{background:var(--card);border-radius:20px;box-shadow:var(--lift);padding:26px 30px 22px;margin-bottom:28px;display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.hero-date{display:flex;align-items:baseline;gap:2px;font-weight:700}
.hero-date .num{font:600 52px/0.95 var(--f-display);letter-spacing:-.045em}
.hero-date small{font-size:20px;color:var(--muted);font-weight:500;margin:0 6px 0 3px}
.hero-date em{font-style:normal;font-size:14px;font-weight:500;color:var(--signal);background:var(--signal-soft);border-radius:999px;padding:3px 11px;margin-left:8px;align-self:center}
.hero-stats{display:flex;gap:0;margin:0}
.hero-stats div{padding:0 22px;border-left:1px solid var(--line)}
.hero-stats div:first-child{border-left:0;padding-left:0}
.hero-stats dt{font-size:12px;color:var(--muted);letter-spacing:.08em}
.hero-stats dd{margin:2px 0 0;font-size:24px;font-weight:500;letter-spacing:-.02em}
.hero-stats div:first-child dd{color:var(--signal)}
.hero-run{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.hero-note{font-size:12px}

/* the planner page */
.kick{font:600 11px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin:0}
.hand{font-family:var(--f-hand);font-weight:700}
.signal{color:var(--signal)}
.tiny{font-size:12px}
.page{background:var(--paper);border-radius:22px;box-shadow:0 1px 2px rgba(20,30,28,.05),0 18px 40px -22px rgba(20,30,28,.22);display:grid;grid-template-columns:minmax(0,1fr) 300px;overflow:hidden}
.pg-main{padding:28px 30px 26px;display:flex;flex-direction:column;gap:22px;min-width:0}
.pg-side{padding:28px 24px 24px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--sunk) 35%,var(--paper))}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 28px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.pg-date{display:flex;flex-direction:column;gap:6px}
.pg-date h1{font:600 46px/0.95 var(--f-display);letter-spacing:-.02em}
.pg-nums{display:flex;gap:26px}
.pg-nums div{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.pg-nums b{font-size:42px;line-height:1}
.pg-comment{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.pg-comment input{flex:1;min-width:0;border:0;background:transparent;font:500 18px/1.4 var(--f-hand),var(--f-text);color:var(--ink);padding:2px 0}
.pg-comment input::placeholder{color:var(--muted);opacity:.7}
.pg-comment input:focus{outline:none}
.block .kick{margin-bottom:4px}
.tasks-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:8px}
.tasks-hd .soft{font-size:12px}
.tg{display:grid;grid-template-columns:52px minmax(0,1fr);border-bottom:1px solid var(--rule)}
.tg-sub{font:600 13px/1.3 var(--f-display);color:var(--c);padding:11px 8px 0 0;border-right:1px solid var(--rule);overflow-wrap:anywhere}
.tg ul{list-style:none;margin:0;padding:0}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto 30px auto;gap:10px;align-items:center;padding:8px 0 8px 12px;border-top:1px dashed var(--rule)}
.tl:first-child{border-top:0}
.tl-t{min-width:0;overflow-wrap:anywhere}
.tl-m{font-size:12px;color:var(--muted)}
.tl.done .tl-t{color:var(--muted)}
.mark{width:30px;height:30px;border:0;background:none;border-radius:50%;font:700 22px/1 var(--f-hand);color:var(--signal);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--rule)}
.mark:hover{box-shadow:inset 0 0 0 1.5px var(--signal)}
.mark.o,.mark.tri{box-shadow:none}
.mark.o{font-size:26px}
.mini.ghost{box-shadow:none;background:none}
.mini.ghost:hover{box-shadow:inset 0 0 0 1px var(--line)}

/* 10-minute timetable */
.tt{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.tt-row{display:grid;grid-template-columns:24px minmax(0,1fr);align-items:stretch;border-bottom:1px solid var(--rule)}
.tt-h{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;border-right:1px solid var(--rule)}
.tt-row.is-now .tt-h{color:var(--signal);font-weight:500}
.tt-cells{position:relative;height:21px;background:linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/calc(100% / 6) 100% repeat-x}
.tt-head{border-bottom:0}
.tt-head .tt-ticks{display:grid;grid-template-columns:repeat(6,1fr);font-size:10px;color:var(--muted);text-align:right;padding:2px 0}
.tt-head .tt-ticks span{padding-right:3px}
.tt-ink{position:absolute;top:3px;bottom:3px;border-radius:3px;background:color-mix(in srgb,var(--c) var(--hl),transparent)}
.tt-ink.est{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) var(--hl-est),transparent) 0 5px,color-mix(in srgb,var(--c) calc(var(--hl-est) * .6),transparent) 5px 9px)}
.tt-ink.live{background:color-mix(in srgb,var(--c) var(--hl),transparent);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px);background-size:200% 100%;animation:flow 2.4s linear infinite}
.tt-ink.fresh{animation:grow .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:left center}
.tt-plan{position:absolute;top:3px;bottom:3px;border:1px dashed var(--plan);border-radius:3px}
.tt-now{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--signal);z-index:2}
.tt-now::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--signal)}
.pg-side .legend-chips{margin-top:6px}

/* the runway itself */
.rb{position:relative;height:16px;border-radius:5px;background:var(--paper) linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/calc(100% / var(--hours,16)) 100% repeat-x;flex:1;min-width:0}
.rb.big{height:60px;border-radius:12px;flex:none}
.rb-seg{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--c) var(--hl),transparent);border-radius:4px;overflow:hidden;display:flex;align-items:center}
.rb.big .rb-seg{top:7px;bottom:7px;border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.rb-seg span,.rb-plan span{font-size:12px;font-weight:500;padding:0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rb-seg span{color:#fff}
.rb-seg.est{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,transparent) 0 5px,color-mix(in srgb,var(--c) 30%,transparent) 5px 10px)}
.rb-seg.est span{color:var(--ink);text-shadow:0 0 6px var(--card)}
.rb-seg.live{background:var(--c);background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.22) 0 8px,transparent 8px 16px);background-size:200% 100%;animation:flow 2.4s linear infinite}
.rb-seg.live::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:#fff;opacity:.85}
.rb-seg.fresh{animation:grow .7s cubic-bezier(.2,.9,.3,1) both;transform-origin:left center}
@keyframes flow{to{background-position:-32px 0}}
@keyframes grow{from{transform:scaleX(0);opacity:.3}}
.rb-plan{position:absolute;top:7px;bottom:7px;border:1.5px dashed var(--plan);background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:8px;display:flex;align-items:center;color:var(--muted)}
.rb:not(.big) .rb-plan{top:1px;bottom:1px;border-radius:3px;border-width:1px}
.rb-now{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--signal);border-radius:1px;z-index:2}
.rb:not(.big) .rb-now{top:-3px;bottom:-3px;width:1.5px}
.rb-now b{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--signal);color:var(--on-signal);font-size:11px;font-weight:500;padding:2px 6px;border-radius:6px;white-space:nowrap}
.rb-ruler{position:relative;height:16px;font-size:11px;color:var(--muted)}
.rb-ruler span{position:absolute;transform:translateX(-50%)}
.rb-untimed{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap}
.rb-untimed i{width:8px;height:8px;border-radius:2px;background:var(--c);margin-left:4px}
.rb-untimed b{font-weight:500;color:var(--ink)}
.legend-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.legend-chips li{display:flex;align-items:center;gap:6px}
.legend-chips i{width:9px;height:9px;border-radius:3px}
.legend-chips span{color:var(--ink)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.today{display:flex;flex-direction:column;gap:28px;min-width:0}

/* now card */
.now{background:var(--card);border-radius:16px;padding:22px 24px 20px;box-shadow:var(--lift-signal),inset 0 0 0 1px var(--rule);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:repeating-linear-gradient(90deg,var(--signal) 0 18px,transparent 18px 28px)}
.now-label{font-size:12px;letter-spacing:.14em;color:var(--signal);font-weight:500;display:flex;align-items:center;gap:7px}
.now-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--signal)}
.now.running .now-label::before{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.now h2{font:700 28px/1.3 var(--f-text);letter-spacing:-.01em;margin-top:4px}
.now .lin{margin:0;font-size:13px;color:var(--muted)}
.now .est{margin:2px 0 0;font-size:13px;color:var(--muted)}
.now .acts{margin-top:16px}
.now.empty{box-shadow:none;background:transparent;border:1.5px dashed var(--line)}
.now.empty::before{display:none}
.clock{font:500 64px/1 var(--f-num);letter-spacing:-.04em;margin-top:14px;color:var(--signal)}
.track{height:6px;border-radius:3px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--sunk) 0 18px,transparent 18px 28px);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--signal);border-radius:3px;transition:width 1s linear}

.btn{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500}
.btn:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.btn.primary{background:var(--signal);box-shadow:none;color:var(--on-signal)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{box-shadow:none;background:none;color:var(--muted);padding-inline:8px}
.btn.quiet:hover{color:var(--ink)}
.btn:active{transform:scale(.97)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.acts.col{flex-direction:column;align-items:stretch}

/* lists */
.block{display:flex;flex-direction:column;gap:6px}
.block h3,.grove-hd h3{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.12em}
.grove-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grove-hd>span{font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:5px}
.grove-hd b{color:var(--ink);font-weight:500;font-size:15px}
.fold{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:2px 0;color:var(--muted)}
.fold:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}
.fold span{font-size:12px}
.fold svg{transition:transform .15s}
.fold[aria-expanded="false"] svg{transform:rotate(-90deg)}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row-t{display:flex;flex-direction:column;min-width:0}
.row-t span{overflow-wrap:anywhere}
.row-t small{font-size:12px;color:var(--muted)}
.row-m{font-size:13px;color:var(--muted);white-space:nowrap}
.row.done .row-t span{text-decoration:line-through;color:var(--muted)}
.row.event .row-t span{color:var(--muted)}
.dotslot{width:6px;height:6px;border-radius:50%;background:var(--ground);justify-self:center}
.check{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;background:var(--card);transition:background .15s,border-color .15s}
.check:checked{background:var(--signal);border-color:var(--signal);animation:pop .3s ease}
.check:checked::after{content:"";width:5px;height:9px;border:solid var(--on-signal);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{50%{transform:scale(1.2)}}
.mini{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12px;white-space:nowrap;color:var(--muted)}
.mini:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mini.signal{color:var(--signal);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--signal) 45%,var(--line))}
.mini.signal:hover{background:var(--signal);color:var(--on-signal);box-shadow:none}

/* seven days */
.week{background:var(--paper);border-radius:22px;padding:22px 26px;box-shadow:0 1px 2px rgba(20,30,28,.05)}
.week .grove-hd{margin-bottom:6px}
.wk{display:flex;flex-direction:column;gap:7px}
